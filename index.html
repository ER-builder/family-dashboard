<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Rifman Almanac</title>
  <!-- 2026-05-17: meta-refresh removed. Previously content="21600" forced
       a full page reload every 6h for memory hygiene, but it also wiped
       Spotify JS state mid-track → card flashed idle for one 15s poll →
       suspected contributor to "Spotify randomly stops" reports.
       Replaced with a soft-reset interval below (clears intervals, frees
       Spotify innerHTML, then re-bootstraps) — same memory benefit, no
       perceived stop. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,500;1,9..144,600&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* warm cream text on deep aubergine night — brightness boost 2026-04-27 */
      --ink:        #fbf0d6;   /* was #f3e7cf */
      --ink-soft:   #d6c6a5;   /* was #c7b89e */
      --ink-dim:    #998a6f;   /* was #8a7d62 */
      --ink-faint:  #6a6048;   /* was #58503f */

      --paper:      #1a1422;   /* was #14101a — slightly lifted */
      --paper-2:    #281f30;   /* was #1f1925 — brighter cards */
      --paper-3:    #322738;   /* was #2a2230 */

      /* print-mag accents — slightly more saturation in soft tints */
      --ochre:      #f0bc55;   /* was #e9b44c — touch warmer */
      --ochre-soft: rgba(240, 188, 85, 0.18);
      --terracotta: #d05f48;   /* was #c8553d */
      --terracotta-soft: rgba(208, 95, 72, 0.17);
      --sage:       #76b48f;   /* was #6ba883 */
      /* Spotify's own green. Brand mark only — never for our own furniture,
         which stays on the almanac palette. */
      --spotify-green: #1db954;
      --sage-soft:  rgba(118, 180, 143, 0.15);
      --cobalt:     #7ba0d4;   /* was #6e95c8 */
      --cobalt-soft: rgba(123, 160, 212, 0.16);
      --lavender:   #c0b3d4;   /* was #b4a6c9 */
      --lavender-soft: rgba(192, 179, 212, 0.16);

      --rule:        rgba(251, 240, 214, 0.13);
      --rule-strong: rgba(251, 240, 214, 0.26);

      --serif:   "Fraunces", "Heebo", "Frank Ruhl Libre", Georgia, "Times New Roman", serif;
      --sans:    "Public Sans", "Heebo", "Frank Ruhl Libre", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono:    "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
      /* Display face for big glanceable numbers (clock, weather temp).
         DM Serif Display: high-contrast Bodoni-style — looks like an editorial
         masthead, but its tall narrow tabular figures read instantly at
         across-the-kitchen distance. Each digit is unmistakable as a shape. */
      --display: "DM Serif Display", "Fraunces", Georgia, serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 400;
      letter-spacing: 0.005em;
      -webkit-font-smoothing: antialiased;
      background:
        /* warm pendant-light spotlight, top-left — brighter 2026-04-27 */
        radial-gradient(ellipse 95% 75% at 18% -8%, rgba(240, 188, 85, 0.26) 0%, transparent 60%),
        /* warm glow, bottom-right corner — brighter */
        radial-gradient(ellipse 75% 95% at 112% 112%, rgba(208, 95, 72, 0.16) 0%, transparent 58%),
        /* base midnight gradient — lifted */
        linear-gradient(180deg, #1a1422 0%, #221a2a 55%, #1a1422 100%);
    }

    /* paper grain overlay — subtle, like newsprint */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.42;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.91  0 0 0 0 0.81  0 0 0 0.07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 0.55fr) minmax(0, 1.45fr);
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 18px;
      padding: 18px 22px;
      height: 100vh;
    }
    .app > .masthead   { grid-column: 1 / -1; }

    /* ─────────────────────────────────────────
       MASTHEAD — newspaper-style header
       ───────────────────────────────────────── */
    .masthead {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 28px;
      padding: 6px 4px 16px;
      border-bottom: 1px solid var(--rule-strong);
      position: relative;
    }
    .masthead::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: -3px;
      height: 1px;
      background: var(--rule);
    }
    .marque { display: flex; flex-direction: column; }
    .greeting {
      font-family: var(--serif);
      font-variation-settings: "opsz" 96;
      font-size: clamp(30px, 3.7vw, 44px);
      font-weight: 600;
      line-height: 1.05;
      color: var(--ink);
      margin-top: 0;
      letter-spacing: -0.005em;
    }
    .date {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(18px, 1.8vw, 22px);
      color: var(--ink-soft);
      margin-top: 8px;
      letter-spacing: 0.01em;
    }
    .clock {
      /* DM Serif Display — editorial masthead numbers. Tall, dramatic, glanceable.
         Each digit is a memorable shape (flat-bottomed 2, tailed 5, sharp 7) so
         kids parse it instantly without sounding it out. Single weight by design;
         the high-contrast strokes do the visual work. */
      font-family: var(--display);
      font-weight: 400;
      font-style: normal;
      /* 2026-05-17: +6% scale for kitchen-distance glanceability (~1.5–2m). */
      font-size: clamp(68px, 10.2vw, 124px);
      line-height: 0.88;
      color: var(--ink);
      letter-spacing: -0.015em;
      font-feature-settings: "tnum" 1, "lnum" 1;
      /* Soft pendant-light glow tying back to the masthead spotlight motif. */
      text-shadow: 0 2px 28px rgba(233, 180, 76, 0.12);
    }

    /* ─────────────────────────────────────────
       CARDS — base
       ───────────────────────────────────────── */
    .card {
      background: var(--paper-2);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--rule);
      box-shadow:
        inset 0 1px 0 rgba(243, 231, 207, 0.04),
        0 18px 44px -20px rgba(0, 0, 0, 0.65);
      position: relative;
    }

    /* Eyebrow label inside cards (NOT to collide with .label class set by JS on routine items) */
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--sans);
      /* 2026-05-17: 12 → 13px, +letter-spacing for kitchen glanceability. */
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    .eyebrow .glyph {
      color: var(--ochre);
      font-family: var(--serif);
      font-style: italic;
      font-size: 17px;
      letter-spacing: 0;
      line-height: 1;
    }
    .eyebrow .name {
      color: var(--ink-soft);
    }
    .eyebrow .rule {
      flex: 1;
      height: 1px;
      background: var(--rule);
    }
    .eyebrow .meta {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--ink-dim);
      font-weight: 400;
    }

    .card .body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ─────────────────────────────────────────
       CALENDAR — block agenda (B′ redesign 2026-05-10)
       Vertical stack of chunky event cards. Today section split into
       Now / Up Next; Tomorrow section visually recessed (dimmer text +
       indented + dashed separator) so a glance can't confuse the day.
       Replaced the prior 06–21 vertical timeline.
       ───────────────────────────────────────── */
    .calendar { grid-row: 3; grid-column: 1; }
    .calendar .body {
      gap: 0;
      overflow-y: auto;
      position: relative;
    }
    .calendar .body::-webkit-scrollbar { width: 5px; }
    .calendar .body::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 3px; }
    /* Reserve clearance at the bottom of the agenda so the fixed Spotify
       corner button (bottom-left) doesn't overlap the last row. Without this,
       "Push the bins out 30m" loses its time.

       2026-09-08: this used to be gated on routine modes only — a leftover
       from when #spotify-corner was itself gated on them. It has been visible
       in every mode since the 2026-05-17 hardening pass, so the agenda was
       running under a full-size pill all day with no clearance at all; the
       redesign made it obvious by putting the Tomorrow strip down there. The
       default-mode pill is the full labelled form and needs more room than the
       48px routine-mode puck, hence the two values.

       Sized from measured geometry at 1280×800, not folklore: the button's top
       edge sits ~34px above the bottom of .calendar .body in default mode and
       ~33px in routine modes, so these are that plus a few px of daylight. */
    .calendar .body { padding-bottom: 44px; }
    body[data-mode="morning"] .calendar .body,
    body[data-mode="evening"] .calendar .body {
      padding-bottom: 42px;   /* the corner pill collapses to a 48px puck here */
    }

    /* All-day chips strip (today only) */
    .cal-allday {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      padding: 0 0 4px;
    }
    .cal-allday:empty { display: none; }
    .cal-allday .chip {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      color: var(--terracotta);
      background: var(--terracotta-soft);
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .cal-allday .chip.source-family { background: var(--ochre-soft);      color: var(--ochre); }
    .cal-allday .chip.source-elul   { background: var(--cobalt-soft);     color: var(--cobalt); }
    .cal-allday .chip.source-school { background: var(--sage-soft);       color: var(--sage); }
    .cal-allday .chip.source-lior   { background: var(--terracotta-soft); color: var(--terracotta); }

    /* Agenda — block list */
    .agenda {
      display: flex;
      flex-direction: column;
      /* 2026-09-08: every px of chrome here is one the fitter takes out of the
         event count instead. Trimmed gap 8 → 7 and the section-head padding
         8 → 4; both are pure spacing, no type size was touched. */
      gap: 7px;
      min-height: 0;
    }
    /* Do NOT let agenda children flex-shrink. `.card .body` is a flex column
       with a definite height, so its descendants are flex items with the
       default `flex-shrink: 1` — when the agenda outgrows the card, the blocks
       silently compress *below their own content height* and, being
       `overflow: hidden`, eat their own titles. Caught 2026-09-08: an evening
       block reported 26.9px tall around a 24.1px title, rendering as a time
       and a source label with a blank space where the event name should be.
       It is the calendar's version of the routine card's silently-missing 8th
       item, and it also blinds fitAgenda() — nothing ever "overflows", so
       there is nothing to trim. Pinning the basis makes an overrun visible
       geometrically, which is exactly what the fitter measures.

       All three levels have to be pinned. `.calendar .body` is the flex
       column; `.agenda` is one of its items, and was itself being squashed so
       that its own children spilled past its box while it reported a tidy
       height — which is how the first version of this fix still measured zero
       overflow while blocks ran 100px past the card. */
    .calendar .body > *,
    .agenda > *,
    .cal-tomorrow > * { flex: 0 0 auto; }
    .agenda .section-head {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-dim);
      padding: 4px 0 0;
    }
    .agenda .section-head.now { color: var(--terracotta); }
    .agenda .day-head {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: 17px;
      color: var(--ochre);
      letter-spacing: 0.005em;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .agenda .day-head .dot {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-dim);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      font-style: normal;
    }

    /* ── Event block — TWO LINES as of 2026-09-08.
       A compact meta row (time · duration · source) sits above a title that
       owns the full column width.

       It used to be a single `56px | 1fr | auto` grid row. At 1280px the
       calendar column is ~352px, ~312px of content; that grid spent ~100px of
       it on the time cell, the duration cell and two 20px gaps, leaving the
       title ~210px — which is why titles truncated constantly and why the gap
       had been widened 14 → 20px to stop RTL Hebrew colliding with the
       duration. Stacking hands the title the whole ~272px AND lets the time
       grow 13 → 15px: time is the primary scanning key on an agenda and was
       the smallest text on the card. */
    .agenda .block {
      display: block;
      padding: 8px 14px 8px 20px;
      background: var(--paper-3);
      border-radius: 10px;
      border: 1px solid var(--rule);
      overflow: hidden;
      box-shadow: 0 4px 12px -8px rgba(0, 0, 0, 0.4);
      position: relative;
      cursor: pointer;
      /* No 350ms tap delay, so a single `click` handler is enough — see the
         2026-05-17 hardening notes on why we never pair click with touchend. */
      touch-action: manipulation;
      --block-bar: var(--cobalt);
    }
    .agenda .block:active {
      background: var(--paper-2);
      border-color: var(--rule-strong);
    }
    /* Source bar is a ::before pseudo, NOT a child div — old Portal Chromium
       auto-places abs-positioned grid children into the first track. The block
       is no longer a grid, but the rule still stands: keep it a pseudo. */
    .agenda .block::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--block-bar);
      border-radius: 10px 0 0 10px;
    }
    .agenda .block.source-family { --block-bar: var(--ochre); }
    .agenda .block.source-elul   { --block-bar: var(--cobalt); }
    .agenda .block.source-school { --block-bar: var(--sage); }
    .agenda .block.source-lior   { --block-bar: var(--terracotta); }
    .agenda .block.now {
      background: linear-gradient(135deg, rgba(208, 95, 72, 0.18) 0%, var(--paper-3) 70%);
      border-color: var(--terracotta);
    }

    /* Meta row: time, duration, then the source label pushed to the far edge. */
    .agenda .block .meta {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin-bottom: 3px;
      line-height: 1.1;
      min-width: 0;
    }
    .agenda .block .when {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--ink-soft);
      font-weight: 700;
      letter-spacing: 0.02em;
      font-feature-settings: "tnum" 1;
      flex-shrink: 0;
    }
    .agenda .block.now .when { color: var(--terracotta); font-size: 16px; }
    .agenda .block .dur {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-dim);
      font-weight: 700;
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }
    .agenda .block .src {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--block-bar);
      opacity: 0.85;
      margin-left: auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .agenda .block .ti {
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.15;   /* DM Serif Display has tall ascenders; tighter
                              leading centres the row optically */
      letter-spacing: -0.003em;
      /* 2-line clamp rather than single-line ellipsis, so long Hebrew/English
         titles degrade gracefully. Fine on Portal Chromium. */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-width: 0;
    }
    .agenda .block.now .ti { font-size: 24px; font-weight: 600; }

    /* ── Tomorrow. Collapsed to a one-glance strip in most modes; expanded to
       real blocks in evening mode, when tomorrow is actually what you want.
       Before 2026-09-08 this was always six 13px blocks — ~220px of the column
       (about 40%) spent on text that is texture, not information, at kitchen
       distance, and the thing that pushed the agenda into a scrollbar. */
    .cal-tomorrow {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--rule-strong);
      display: flex;
      flex-direction: column;
      gap: 5px;
      touch-action: manipulation;
    }
    /* Only the collapsed strip is tappable as a whole. Expanded, the taps
       belong to the individual blocks and the day-head, so the wrapper must
       not claim a pointer it doesn't handle. */
    .cal-tomorrow.tappable { cursor: pointer; }
    .cal-tomorrow .day-head { cursor: pointer; }
    .cal-tomorrow .tsum {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink-soft);
    }
    .cal-tomorrow .tsum .chev {
      margin-left: auto;
      color: var(--ochre);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
    }
    /* Expanded (evening) blocks: recessed, indented, single-line titles — but
       at 15px, not the old 13px. Nothing in the agenda goes below 13px now. */
    .cal-tomorrow .block {
      margin-left: 14px;
      padding-top: 7px;
      padding-bottom: 7px;
      background: rgba(40, 31, 48, 0.55);
    }
    .cal-tomorrow .block .when { color: var(--ink-dim); font-size: 13px; }
    .cal-tomorrow .block .dur,
    .cal-tomorrow .block .src { display: none; }
    .cal-tomorrow .block .meta { margin-bottom: 2px; }
    .cal-tomorrow .block .ti {
      color: var(--ink-soft);
      font-size: 15px;
      font-weight: 400;
      -webkit-line-clamp: 1;
    }
    .cal-tomorrow .block::before { opacity: 0.5; }

    /* "+3 more today" / "+2 more" — opens the day sheet. */
    .cal-more {
      align-self: flex-start;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ochre);
      background: var(--ochre-soft);
      border: none;
      border-radius: 999px;
      padding: 7px 15px;
      margin-top: 2px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .cal-more:active { opacity: 0.75; }

    .cal-empty, .cal-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      text-align: center;
      padding: 18px;
      color: var(--ink-soft);
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
    }
    .cal-empty::before, .cal-error::before {
      content: "✦";
      display: block;
      font-family: var(--serif);
      font-size: 28px;
      color: var(--ochre);
      opacity: 0.55;
      margin-bottom: 8px;
      line-height: 1;
      font-style: normal;
    }
    .cal-error { color: var(--terracotta); }
    .cal-error::before { color: var(--terracotta); content: "❡"; }
    .cal-error small {
      display: block;
      margin-top: 6px;
      font-family: var(--mono);
      font-style: normal;
      font-size: 10px;
      letter-spacing: 0.05em;
      color: var(--ink-dim);
    }

    /* ─────────────────────────────────────────
       RIGHT COLUMN — context strip (top) + primary panel (bottom)
       UX redesign D + E.1, 2026-04-26.
       Top region is a horizontal "always-on" strip with weather, transit,
       stars compacted into one row. Bottom region is a single primary panel
       that swaps content via body[data-mode] — morning routine, evening
       routine, or to-do (default). Every card ALWAYS reachable now.
       ───────────────────────────────────────── */
    .right {
      grid-row: 3;
      grid-column: 2;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    /* ── CONTEXT STRIP (top) ── */
    .context-strip {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) 1px minmax(0, 1.82fr) 1px minmax(0, 0.75fr);
      gap: 14px;
      align-items: stretch;
      padding: 14px 18px;
      background: var(--paper-2);
      border: 1px solid var(--rule);
      border-radius: 18px;
      box-shadow:
        inset 0 1px 0 rgba(243, 231, 207, 0.04),
        0 18px 44px -20px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      position: relative;
    }
    .cs-divider {
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--rule-strong) 25%, var(--rule-strong) 75%, transparent);
      align-self: stretch;
    }

    /* Weather slot */
    .cs-weather {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .cs-weather .icon {
      font-size: 46px;
      line-height: 1;
      filter: drop-shadow(0 3px 10px rgba(233, 180, 76, 0.35));
      flex-shrink: 0;
    }
    .cs-weather .info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .cs-weather .temp {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(48px, 5vw, 62px);
      line-height: 0.95;
      color: var(--ochre);
      font-feature-settings: "tnum" 1, "lnum" 1;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 18px rgba(233, 180, 76, 0.20);
    }
    .cs-weather .desc {
      font-family: var(--serif);
      font-style: italic;
      /* 2026-05-17: 16 → 18px context-strip readability boost. */
      font-size: 18px;
      color: var(--ink-soft);
      text-transform: lowercase;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Transit slot */
    .cs-transit {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }
    .cs-transit .row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .cs-transit .badge {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 800;
      border-radius: 5px;
      padding: 4px 0;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .cs-transit .name {
      font-family: var(--serif);
      /* 2026-05-17: 16 → 18px. */
      font-size: 18px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.003em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cs-transit .status {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .cs-transit .status.good   { background: var(--sage-soft);       color: var(--sage); }
    .cs-transit .status.minor  { background: var(--ochre-soft);      color: var(--ochre); }
    .cs-transit .status.severe { background: var(--terracotta-soft); color: var(--terracotta); }
    /* When live arrivals are present on the 102, hide the "Good Service" pill —
       knowing the next bus is more useful than knowing the line is fine.
       The pill comes back automatically as a fallback if live data drops out. */
    .cs-transit .row.has-arrivals .status { display: none; }

    /* Live arrivals strip under the 102 row — one mini-row per stop/direction. */
    .cs-arrivals {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 6px 0 0 0;   /* flush-left: arrivals sit under the badge column */
    }
    .cs-arrivals:empty { display: none; }
    .cs-arrivals .arr-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ink-soft);
      font-feature-settings: "tnum" 1;
    }
    .cs-arrivals .arr-row .dest {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-dim);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cs-arrivals .arr-row .times { display: flex; gap: 7px; align-items: baseline; flex-wrap: nowrap; }
    .cs-arrivals .arr-row .t { color: var(--ink); font-weight: 700; font-size: 16px; }
    .cs-arrivals .arr-row .t.due { color: var(--ochre); }
    .cs-arrivals .arr-row .t.sched { color: var(--ink-soft); font-weight: 500; }
    .cs-arrivals .arr-row .t .u {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.10em;
      color: var(--ink-dim);
      text-transform: uppercase;
      margin-left: 2px;
      font-weight: 600;
    }
    .cs-arrivals .arr-row .sep { color: var(--ink-faint); }
    .cs-arrivals .arr-row .none {
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-dim);
      font-size: 13px;
    }
    .cs-arrivals .arr-row .sched-tag {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-left: 5px;
      padding: 2px 5px;
      border: 1px solid var(--rule);
      border-radius: 3px;
      font-weight: 700;
    }

    /* ── Radio slot (took over the Stars column, 2026-09-07) ──
       One tap = live Kan Reshet Bet in the page itself. Deliberately compact:
       it's a control, so it doesn't need the width a readout did, and the
       surplus went to the transit slot whose destinations were truncating. */
    .cs-radio {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 4px 6px;
    }
    .radio-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;          /* comfortably over the 40px touch floor */
      padding: 8px 12px;
      background: rgba(243, 231, 207, 0.04);
      border: 1px solid var(--rule);
      border-radius: 12px;
      color: var(--ink);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      text-align: left;
      transition: background 160ms ease, border-color 160ms ease, transform 100ms ease;
    }
    .radio-btn:active { transform: scale(0.97); }
    .radio-glyph {
      font-size: 15px;
      line-height: 1;
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1.5px solid var(--ochre);
      color: var(--ochre);
    }
    .radio-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .radio-name {
      font-family: var(--sans);   /* --sans already falls through to Heebo for Hebrew */
      font-size: 16px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink);
      white-space: nowrap;
    }
    .radio-sub {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Playing: the slot lights up in ochre so it reads across the kitchen. */
    .cs-radio[data-state="playing"] .radio-btn {
      background: var(--ochre-soft);
      border-color: rgba(233, 180, 76, 0.45);
    }
    .cs-radio[data-state="playing"] .radio-glyph {
      background: var(--ochre);
      color: var(--paper);
      border-color: var(--ochre);
    }
    .cs-radio[data-state="playing"] .radio-sub { color: var(--ochre); }
    .cs-radio[data-state="loading"] .radio-glyph { opacity: 0.55; }
    .cs-radio[data-state="error"] .radio-glyph {
      border-color: var(--terracotta);
      color: var(--terracotta);
    }
    .cs-radio[data-state="error"] .radio-sub { color: var(--terracotta); }

    /* Spotify now-playing card in primary panel (spotify mode) */
    .spotify-card {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 28px 24px;
      text-align: center;
      position: relative;
    }
    /* Spotify idle placeholder — shown when nothing's playing. Surfaces the
       last-played track (album art + title + artist) so a single tap restarts
       it. Same dimensions as the live player so the layout doesn't shift. */
    .spotify-card .sp-idle-art {
      width: clamp(140px, 22vw, 200px);
      height: clamp(140px, 22vw, 200px);
      border-radius: 10px;
      background:
        repeating-linear-gradient(45deg, var(--paper-3) 0 8px, var(--paper-2) 8px 16px);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px -10px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
    }
    .spotify-card .sp-idle-art .sp-idle-art-fallback {
      font-size: 72px;
      color: var(--ink-faint);
    }
    .spotify-card .sp-idle-art.has-art .sp-idle-art-fallback { display: none; }
    /* Play-affordance overlay on the album art when there's a last-played track. */
    .spotify-card .sp-idle-art.has-art::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(0,0,0,0.55) 0 38%, rgba(0,0,0,0.15) 38% 70%, transparent 70%);
      pointer-events: none;
    }
    .spotify-card .sp-idle-art.has-art .sp-idle-play-glyph {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
      font-size: 28px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .spotify-card .sp-idle-art:not(.has-art) .sp-idle-play-glyph { display: none; }
    .spotify-card .sp-idle-prompt {
      font-family: var(--serif);
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 600;
      color: var(--ink);
      line-height: 1.2;
    }
    .spotify-card .sp-idle-prompt.empty {
      font-style: italic;
      font-weight: 500;
      color: var(--ink-soft);
    }
    .spotify-card .sp-idle-sub {
      font-family: var(--sans);
      font-size: clamp(13px, 1.5vw, 16px);
      color: var(--ink-soft);
      margin-top: 4px;
    }
    .spotify-card .sp-idle-sub:empty { display: none; }
    .spotify-card .sp-launch-btn {
      margin-top: 8px;
      /* 2026-05-17: de-Spotifyed — was solid #1DB954 (brand green) which
         dominated the editorial dashboard palette. Now paper card + sage
         glyph for the Spotify mark; reads as part of the dashboard. */
      background: linear-gradient(135deg, var(--paper-3) 0%, var(--paper-2) 100%);
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      padding: 12px 24px;
      font-family: var(--sans);
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-shadow: 0 6px 18px -8px rgba(0, 0, 0, 0.55);
    }
    .spotify-card .sp-launch-btn svg { color: var(--spotify-green); }
    .spotify-card .sp-launch-btn:active { transform: scale(0.97); }
    .spotify-card .sp-launch-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .spotify-card[data-state="idle"] .sp-big-art,
    .spotify-card[data-state="idle"] .sp-big-art-placeholder,
    .spotify-card[data-state="idle"] .sp-controls,
    .spotify-card[data-state="idle"] .sp-close { display: none !important; }
    .spotify-card[data-state="playing"] .sp-idle-art,
    .spotify-card[data-state="playing"] .sp-idle-prompt,
    .spotify-card[data-state="playing"] .sp-idle-sub,
    .spotify-card[data-state="playing"] .sp-launch-btn { display: none !important; }
    .spotify-card .sp-big-art {
      width: clamp(140px, 22vw, 200px);
      height: clamp(140px, 22vw, 200px);
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 12px 40px -10px rgba(0,0,0,0.7);
      background: var(--paper-3);
    }
    .spotify-card .sp-big-art-placeholder {
      width: clamp(140px, 22vw, 200px);
      height: clamp(140px, 22vw, 200px);
      border-radius: 10px;
      background: var(--paper-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      box-shadow: 0 12px 40px -10px rgba(0,0,0,0.7);
    }
    .spotify-card .sp-big-track {
      font-family: var(--display);
      /* 2026-05-17: editorial DM Serif Display + larger for kitchen glance.
         Marquee CSS below kicks in when title overflows container. */
      font-size: clamp(22px, 2.9vw, 32px);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.1;
      letter-spacing: -0.01em;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .spotify-card .sp-big-track.marquee > span {
      display: inline-block;
      padding-left: 100%;
      animation: sp-marquee 12s linear infinite;
    }
    @keyframes sp-marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .spotify-card .sp-big-artist {
      font-family: var(--sans);
      font-size: clamp(14px, 1.7vw, 18px);
      color: var(--ink-soft);
      margin-top: 4px;
    }
    .spotify-card .sp-controls {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 4px;
    }
    .spotify-card .sp-ctrl-btn {
      background: none;
      border: none;
      color: var(--ink);
      font-size: 28px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 150ms ease, transform 100ms ease;
    }
    .spotify-card .sp-ctrl-btn:active { transform: scale(0.88); }
    /* 2026-05-19: stronger "tap received" flash for kitchen-distance
       glanceability. JS adds .tap-flash for 240ms on every spCommand
       click; CSS lights the button up with ochre so the family can SEE
       the tap landed, even while waiting 1-2s for Spotify to actually
       pause/skip. Paired with optimistic icon flip in spCommand. */
    .spotify-card .sp-ctrl-btn.tap-flash {
      background: var(--ochre-soft);
      box-shadow: 0 0 0 3px var(--ochre-soft);
      transition: background 80ms ease, box-shadow 80ms ease, transform 100ms ease;
    }
    .spotify-card .sp-ctrl-btn.sp-play-pause { font-size: 36px; }
    /* "Open Spotify" pill — playing-state only. Editorial palette (paper card
       + sage glyph) instead of brand green — matches the rest of the dash. */
    .spotify-card .sp-open-pill {
      display: none;
      margin-top: 14px;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 8px 14px;
      background: linear-gradient(135deg, var(--paper-3) 0%, var(--paper-2) 100%);
      color: var(--ink);
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      transition: transform 100ms ease;
    }
    .spotify-card .sp-open-pill:active { transform: scale(0.97); }
    .spotify-card .sp-open-pill .sp-open-glyph {
      font-size: 14px;
      line-height: 1;
      color: var(--sage);
    }
    .spotify-card[data-state="playing"] .sp-open-pill { display: inline-flex; }
    /* Long-press hint on the big album art — a small ⤴ in the corner so the
       affordance is visible. The tap itself is short-press-safe (does
       nothing); 700ms hold fires kiosk://spotify/launch. */
    .spotify-card .sp-big-art-wrap-rel { position: relative; }
    .spotify-card .sp-big-art-launch-hint {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 16, 26, 0.62);
      color: var(--ink);
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }
    .spotify-card[data-state="playing"] .sp-big-art-launch-hint { display: flex; }
    /* Stale-connection badge — appears when proxy hasn't replied in 60s.
       Subtle, ink-dim — not alarmist; just acknowledges to the family that
       we know the card might be lying about live state. */
    .spotify-card .sp-stale-badge {
      display: none;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-top: 6px;
    }
    .spotify-card.sp-stale .sp-stale-badge { display: block; }
    .spotify-card .sp-stale-badge::before {
      content: "— connection — retrying";
    }
    .spotify-card .sp-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      color: var(--ink-dim);
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    /* Spotify launch button -- bottom-left corner, mirrors exit button.
       Editorial-palette tone (paper card + sage accent) instead of Spotify
       brand green — matches the rest of the dashboard's print aesthetic.
       Sage is the calm/ambient accent and doesn't conflict with the kid colors
       (cobalt = Eitan, terracotta = Tamar). */
    /* Always-visible corner launcher (2026-05-17). Previously hidden in
       spotify mode because the in-card launcher covered idle state — but
       when music is *playing* there was no path to open the Spotify APK
       at all (in-card launcher only renders for data-state="idle"). */
    #spotify-corner { display: inline-flex; }
    #spotify-corner {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 9999;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 10px 12px;
      background: linear-gradient(135deg, var(--paper-3) 0%, var(--paper-2) 100%);
      color: var(--ink);
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      font-family: var(--sans);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      box-shadow:
        0 8px 20px -6px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(243, 231, 207, 0.05);
      transition: transform 100ms ease, box-shadow 200ms ease;
    }
    #spotify-corner:active { transform: scale(0.97); }
    #spotify-corner .sp-corner-icon {
      font-size: 18px;
      line-height: 1;
      color: var(--spotify-green);
      display: block;
    }
    /* 1em so the existing font-size rules above (18px in the pill, 22px in the
       routine-window puck) go on sizing it with no extra breakpoints. */
    #spotify-corner .sp-corner-icon svg {
      width: 1em;
      height: 1em;
      display: block;
    }
    #spotify-corner .sp-corner-label {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1;
    }
    #spotify-corner .sp-corner-sub {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--ink-dim);
      text-transform: uppercase;
      font-weight: 500;
      margin-top: 4px;
    }

    /* Back-to-Routine pill — shown only when music override is on AND the
       active mode is morning/evening (so we have a routine to return to).
       Mirrors the Spotify-corner geometry. */
    #routine-back { display: none; }
    body[data-music-override="true"][data-mode="morning"] #routine-back,
    body[data-music-override="true"][data-mode="evening"] #routine-back {
      display: inline-flex;
    }
    #routine-back {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 9999;
      align-items: center;
      gap: 10px;
      padding: 10px 18px 10px 14px;
      background: linear-gradient(135deg, var(--paper-3) 0%, var(--paper-2) 100%);
      color: var(--ink);
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      font-family: var(--sans);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      box-shadow:
        0 8px 20px -6px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(243, 231, 207, 0.05);
    }
    #routine-back:active { transform: scale(0.97); }
    #routine-back .arrow { font-size: 16px; line-height: 1; color: var(--ochre); }
    /* Morning mode: weather forecast is critical — give weather most of the
       row and hide the radio slot, exactly as the Stars slot was hidden before
       it. Measured 2026-09-07: at 1280px the morning row cannot hold the
       weather outlook (5 cells at a readable 40px), two-line transit AND the
       radio button. Squeezing weather to fit the radio collapsed the outlook
       cells to 10px, which is worse than not having the button for three
       weekday hours. The radio is one tap away the other 21. */
    body[data-mode="morning"] .context-strip {
      grid-template-columns: minmax(0, 2.2fr) 1px minmax(0, 1fr);
    }
    body[data-mode="morning"] .cs-radio,
    body[data-mode="morning"] .cs-divider-radio {
      display: none;
    }
    /* Weather contents grow to fill the new room: bigger temp, bigger icon,
       hourly outlook becomes visible. */
    body[data-mode="morning"] .cs-weather { gap: 18px; }
    body[data-mode="morning"] .cs-weather .icon { font-size: 62px; }
    body[data-mode="morning"] .cs-weather .temp { font-size: clamp(60px, 6vw, 76px); }
    body[data-mode="morning"] .cs-weather .desc { font-size: 18px; }
    body[data-mode="morning"] .cs-weather .w-outlook {
      display: grid !important;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      flex: 1;
      padding-left: 22px;
      border-left: 1px solid var(--rule-strong);
      margin-left: 14px;
    }
    /* Hidden by default; shown in morning mode (full size, rule above) and
       in todo mode (compact). Evening mode keeps it hidden — that screen
       is dominated by routine items so we don't need extra context. */
    .w-outlook { display: none; }
    body[data-mode="spotify"] .context-strip,
    body[data-mode="todo"]    .context-strip {
      grid-template-columns: minmax(0, 1.9fr) 1px minmax(0, 1.62fr) 1px minmax(0, 0.75fr);
    }
    body[data-mode="spotify"] .cs-weather .w-outlook,
    body[data-mode="todo"]    .cs-weather .w-outlook {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      flex: 1;
      padding-left: 18px;
      border-left: 1px solid var(--rule-strong);
      margin-left: 12px;
    }
    /* Default-mode hourly cells are tighter than morning mode but readable. */
    body[data-mode="spotify"] .w-outlook .h .when,
    body[data-mode="todo"]    .w-outlook .h .when { font-size: 10px; }
    body[data-mode="spotify"] .w-outlook .h .icon,
    body[data-mode="todo"]    .w-outlook .h .icon { font-size: 20px; }
    body[data-mode="spotify"] .w-outlook .h .t,
    body[data-mode="todo"]    .w-outlook .h .t { font-size: 14px; }
    .w-outlook .h {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }
    .w-outlook .h .when {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--ink-dim);
      font-weight: 700;
      text-transform: uppercase;
    }
    .w-outlook .h .icon {
      font-size: 22px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(240, 188, 85, 0.25));
    }
    .w-outlook .h .t {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      font-feature-settings: "tnum" 1;
    }
    .w-outlook .h.rain .t { color: var(--cobalt); }

    /* ── PRIMARY PANEL (bottom) ── */
    .primary-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    /* Default: hide all primary-panel children. Mode-specific rules show one. */
    .primary-panel > .card,
    .primary-panel > section {
      display: none;
    }
    /* Music override: when music starts during a routine window, the spotify
       card takes over the primary panel until the user dismisses it (Back to
       Routine pill) or the music has been stopped for the grace period. */
    body[data-music-override="true"] .primary-panel > #morning-card,
    body[data-music-override="true"] .primary-panel > #evening-card { display: none !important; }
    body[data-music-override="true"] .primary-panel > .spotify-card { display: flex !important; }
    body[data-music-override="true"] #spotify-corner { display: none !important; }

    body[data-mode="morning"] .primary-panel > #morning-card,
    body[data-mode="evening"] .primary-panel > #evening-card,
    body[data-mode="spotify"] .primary-panel > .spotify-card {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    /* The visible card fills the panel — release the old `flex-shrink: 0` and
       any internal max-height that capped them when stacked. */
    .primary-panel > .card {
      flex-shrink: 1;
    }

    /* ─────────────────────────────────────────
       WEATHER — atmospheric card
       ───────────────────────────────────────── */
    .weather {
      flex-shrink: 0;
      background:
        radial-gradient(ellipse 90% 70% at 85% 0%, rgba(233, 180, 76, 0.20) 0%, transparent 60%),
        linear-gradient(155deg, #2c2336 0%, #1f1828 100%);
      overflow: hidden;
    }
    .weather::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 88% 22%, rgba(233, 180, 76, 0.18), transparent 32%);
      pointer-events: none;
    }
    /* Weather: compact horizontal layout — top row inline, stats inline, hourly thin */
    .weather { padding: 14px 18px; }
    .weather .eyebrow { margin-bottom: 8px; }
    .weather .body { gap: 10px; }
    .weather .top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      position: relative;
    }
    .weather .icon {
      font-size: 42px;
      line-height: 1;
      filter: drop-shadow(0 3px 10px rgba(233, 180, 76, 0.35));
    }
    .weather .temp {
      /* Same display face as the clock, but in OCHRE — visually warm, signals
         "info you actually need to plan your day." Pairs with the warm pendant
         spotlight already living in the weather card's gradient. */
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(44px, 5vw, 60px);
      line-height: 0.95;
      color: var(--ochre);
      font-feature-settings: "tnum" 1, "lnum" 1;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 18px rgba(233, 180, 76, 0.20);
    }
    .weather .desc {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: 14px;
      color: var(--ink-soft);
      text-transform: lowercase;
      margin-top: 2px;
      letter-spacing: 0.005em;
    }
    .weather .stats {
      display: flex;
      flex-direction: column;
      gap: 1px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink);
      font-feature-settings: "tnum" 1;
      text-align: right;
      line-height: 1.25;
    }
    .weather .stats span { display: block; }
    .weather .stats span::before {
      content: attr(data-label);
      font-family: var(--sans);
      font-size: 8px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-dim);
      font-weight: 700;
      margin-right: 4px;
    }
    .weather .hourly {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding-top: 8px;
      border-top: 1px dashed var(--rule);
      position: relative;
    }
    .weather .hourly .h {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .weather .hourly .h .when {
      font-family: var(--sans);
      font-size: 8px;
      letter-spacing: 0.16em;
      color: var(--ink-dim);
      font-weight: 700;
      text-transform: uppercase;
    }
    .weather .hourly .h .icon {
      font-size: 14px;
      line-height: 1;
      filter: drop-shadow(0 2px 5px rgba(233, 180, 76, 0.22));
    }
    .weather .hourly .h .t {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink);
      font-feature-settings: "tnum" 1;
    }
    .weather .hourly .h.rain .t { color: var(--cobalt); }

    /* ─────────────────────────────────────────
       TRANSIT — Northern Line + Bus 102
       ───────────────────────────────────────── */
    .transit { flex-shrink: 0; padding: 12px 18px; }
    .transit .eyebrow { margin-bottom: 6px; }
    .transit .body { gap: 0; }
    .transit .line-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 5px 4px;
      border-bottom: 1px solid var(--rule);
    }
    .transit .line-row:last-child { border-bottom: 0; }
    .transit .badge {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 800;
      border-radius: 5px;
      padding: 4px 0;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .transit .line-name {
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.003em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .transit .status {
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .transit .status.good   { background: var(--sage-soft);       color: var(--sage); }
    .transit .status.minor  { background: var(--ochre-soft);      color: var(--ochre); }
    .transit .status.severe { background: var(--terracotta-soft); color: var(--terracotta); }

    .transit .arrivals {
      padding: 8px 0 4px 38px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px dashed var(--rule);
      margin-top: 6px;
    }
    .transit .arr-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ink-soft);
    }
    .transit .arr-row .dest {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-dim);
      font-weight: 700;
      flex-shrink: 0;
      min-width: 92px;
    }
    .transit .arr-row .times {
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
      font-feature-settings: "tnum" 1;
    }
    .transit .arr-row .t { color: var(--ink); font-weight: 700; font-size: 15px; }
    .transit .arr-row .t.due { color: var(--ochre); }
    .transit .arr-row .t .u {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--ink-dim);
      text-transform: uppercase;
      margin-left: 2px;
      font-weight: 600;
    }
    .transit .arr-row .sep { color: var(--ink-faint); }
    .transit .arr-row .none { font-family: var(--serif); font-style: italic; color: var(--ink-dim); font-size: 13px; }
    .transit .arr-dbg { font-family: var(--mono); font-size: 9px; letter-spacing: 0.05em; color: rgba(243,231,207,0.18); padding: 4px 0 0 38px; line-height: 1; }
    .transit .arr-row .t.sched { color: var(--ink-soft); font-weight: 600; }
    .transit .arr-row .sched-tag {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-left: 8px;
      padding: 2px 5px;
      border: 1px solid var(--rule);
      border-radius: 3px;
      font-weight: 700;
      vertical-align: 1px;
    }

    /* ─────────────────────────────────────────
       ROUTINE CARDS — library card style
       ───────────────────────────────────────── */
    .routine {
      flex-shrink: 0;
      padding: 0;
      overflow: hidden;
      /* No max-height: kids must see all 8 items without scrolling.
         Other cards in right column shrink to make room.
         The list self-sizes (see `.routine li` flex rules below) so the card
         fits the panel instead of overflowing into `overflow: hidden` — which
         is what silently ate item 8 ("Pack Your Bag") until 2026-09-07. */
    }
    .topstripe {
      height: 8px;
      display: flex;
    }
    .topstripe i {
      flex: 1;
      display: block;
    }
    .morning .topstripe i:nth-child(1) { background: var(--cobalt); }
    .morning .topstripe i:nth-child(2) { background: var(--terracotta); }
    .evening .topstripe i:nth-child(1) { background: var(--lavender); }
    .evening .topstripe i:nth-child(2) { background: var(--ochre); }
    .topstripe::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      height: 1px;
      background: rgba(20, 16, 26, 0.6);
    }

    /* The routine eyebrow sits tighter than other cards' — the 8 checklist
       rows below it are the scarce resource. Scoped so no other card moves. */
    .routine .eyebrow { margin-bottom: 8px; }   /* was the global 14px */
    .routine .inner {
      padding: 8px 14px 8px;     /* tightened from 12/16/14 to fit 8 items without overflow */
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
      position: relative;
    }
    .routine .body { gap: 6px; min-height: 0; }   /* was 10 */
    .routine .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(0, 1fr);   /* let the row shrink below content */
      gap: 18px;          /* was 22 — still clear separation, less overflow risk */
      flex: 1;            /* fill the card, so spare height goes to the rows */
      min-height: 0;
    }

    .routine .kid {
      --kid: var(--ochre);
      --kid-soft: var(--ochre-soft);
      padding: 7px 10px 7px 12px;   /* was 12/12/14/14 — saved ~8px vertical */
      border-radius: 14px;
      background: var(--kid-soft);
      border: 1px solid rgba(251, 240, 214, 0.10);
      border-left: 5px solid var(--kid);   /* thick left stripe in kid accent — strong column ID */
      display: flex;
      flex-direction: column;
      gap: 4px;            /* was 6 */
      position: relative;
      min-height: 0;       /* grid items default to a content-based minimum */
    }
    .routine .kid[data-kid^="eitan"] { --kid: var(--cobalt);     --kid-soft: var(--cobalt-soft); }
    .routine .kid[data-kid^="tamar"] { --kid: var(--terracotta); --kid-soft: var(--terracotta-soft); }

    .routine .kid h3 {
      margin: 0;
      font-family: var(--serif);
      font-variation-settings: "opsz" 96;
      font-size: 17px;       /* was 19 — modest reduction, kid name still prominent */
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 7px;
      letter-spacing: -0.005em;
    }
    .routine .kid h3 .badge {
      font-size: 16px;
      line-height: 1;
    }
    .routine .kid h3 .progress {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 13px;       /* was 11 — legible from across the kitchen */
      color: var(--ink-soft);
      font-weight: 400;
      font-feature-settings: "tnum" 1;
      letter-spacing: 0.05em;
    }

    .routine .progress-bar {
      height: 3px;            /* was 4 */
      border-radius: 999px;
      background: rgba(243, 231, 207, 0.07);
      overflow: hidden;
      margin: -2px 0 0;       /* was -2 0 4 */
    }
    .routine .progress-bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--kid);
      border-radius: 999px;
      transition: width 350ms cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 12px var(--kid);
    }

    .routine ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
      min-height: 0;
    }
    .routine li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 6px;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      border-radius: 9px;
      /* Rows split the list's height evenly and never go under the 40px touch
         floor. Growing into spare space beats leaving a gap at the bottom. */
      flex: 1 1 0;
      min-height: 40px;
      transition: background 140ms ease, transform 100ms ease;
      color: var(--ink);
      border: 0;
    }
    /* Hide transit during a routine window so kids' card has room.
       Parents see transit before/after routine times. */
    /* Pre-redesign rules — kept only as inert no-ops. The .right column no
       longer has direct .transit / .stars children; both live in .context-strip
       (always visible). Body.routine-active also removed in favor of body[data-mode],
       but harmless if anything still toggles it. */
    body.routine-active .right > .transit { display: none; }
    body.routine-active .right > .stars   { display: none; }
    .routine li:hover { background: rgba(243, 231, 207, 0.05); }
    .routine li:active { transform: scale(0.98); }
    .routine li .icon {
      font-size: 19px;
      line-height: 1;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }
    /* The JS sets .label class on the text span inside each routine item. */
    .routine li .label {
      flex: 1;
      min-width: 0;
      line-height: 1.25;
    }
    .routine li input[type="checkbox"] {
      appearance: none;
      /* Chromium's UA stylesheet puts `margin: 3px 3px 3px 4px` on checkboxes.
         Unreset, the 3px top/bottom made every 40px row render at 46px — 48px
         of invisible padding across 8 rows, which pushed item 8 out of the
         card. Only the vertical margins go; the horizontal ones are load-
         bearing for the row's left inset and checkbox↔icon gap. */
      margin: 0 3px 0 4px;
      width: 28px;
      height: 28px;
      border: 2px solid rgba(243, 231, 207, 0.32);
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      cursor: pointer;
      background: transparent;
      transition:
        transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1),
        background 160ms ease,
        border-color 160ms ease;
    }
    .routine li input[type="checkbox"]:checked {
      background: var(--kid);
      border-color: transparent;
      transform: scale(1.08) rotate(-3deg);
    }
    .routine li input[type="checkbox"]:checked::after {
      content: "✓";
      color: var(--paper);
      font-family: var(--sans);
      font-size: 18px;
      font-weight: 800;
    }
    /* The next unchecked item, in the kid's own accent. Kids work top-down,
       so the one row that matters gets a lift and a coloured checkbox. Pure
       paint — background + border-color only, so it can't change row height
       and eat into the vertical budget. */
    .routine li.next { background: rgba(243, 231, 207, 0.07); }
    .routine li.next input[type="checkbox"] { border-color: var(--kid); }
    .routine li.done .label { color: var(--ink-dim); text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .routine li.done .icon { filter: grayscale(0.7); opacity: 0.45; }
    .routine li.optional .label { font-style: italic; color: var(--ink-soft); }
    .routine li.optional::after {
      content: "opt";
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
      padding: 2px 6px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* ─────────────────────────────────────────
       Page entrance
       ───────────────────────────────────────── */
    .masthead { animation: fadeDown 700ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .card     { animation: rise 700ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .calendar { animation-delay: 80ms; }
    .weather  { animation-delay: 140ms; }
    .routine  { animation-delay: 200ms; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: none; }
    }

    /* ─────────────────────────────────────────
       CELEBRATION — fires when a kid finishes morning routine
       ───────────────────────────────────────── */
    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      /* 2026-09-08: 10000 → 10010, so an "all done!" celebration still lands
         on top if the calendar detail sheet (10000) happens to be open. */
      z-index: 10010;
      overflow: hidden;
    }
    .celebration .toast {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%) scale(1);
      font-family: var(--serif);
      font-size: clamp(36px, 5.4vw, 64px);
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      background:
        radial-gradient(ellipse 70% 90% at 50% 0%, rgba(233, 180, 76, 0.20) 0%, transparent 60%),
        var(--paper-2);
      border: 1px solid var(--rule-strong);
      border-radius: 22px;
      padding: 36px 56px;
      box-shadow: 0 24px 80px -20px rgba(0, 0, 0, 0.75);
      animation: celebPop 700ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      letter-spacing: -0.01em;
    }
    .celebration .toast .name {
      font-family: var(--serif);
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .celebration .toast .sub {
      font-family: var(--sans);
      font-style: normal;
      font-weight: 600;
      font-size: 0.32em;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      margin-top: 16px;
    }
    .celebration.fading .toast {
      animation: celebFade 600ms cubic-bezier(0.4, 0, 0.6, 1) both;
    }
    .celebration .confetti {
      position: absolute;
      top: -40px;
      animation: confettiFall linear forwards;
      will-change: transform;
      user-select: none;
    }
    @keyframes celebPop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes celebFade {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    }
    @keyframes confettiFall {
      from { transform: translateY(-40px) rotate(0deg); opacity: 0; }
      8%   { opacity: 1; }
      to   { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
    }
    .kid.celebrating h3 {
      animation: namePulse 1200ms ease-out both;
    }
    @keyframes namePulse {
      0%, 100% { transform: scale(1); }
      40%      { transform: scale(1.08); }
    }

    /* ─────────────────────────────────────────
       CALENDAR DETAIL SHEET (2026-09-08)
       Tapping an event block, the Tomorrow strip, or a "+n more" pill opens
       this. Modelled on .celebration — a fixed full-viewport overlay is a
       known-good shape on Portal's Chromium.

       Deliberately NO backdrop-filter (unproven on this WebView) — a solid
       rgba scrim instead. z-index sits above the 9999 corner pucks so the
       exit-hold gesture can't fire through the sheet; .celebration was moved
       to 10010 so an "all done!" moment still wins.
       ───────────────────────────────────────── */
    #cal-sheet {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: rgba(18, 13, 24, 0.84);
      touch-action: manipulation;
    }
    #cal-sheet.open { display: flex; }
    #cal-sheet .sheet {
      position: relative;
      width: min(720px, 100%);
      max-height: 100%;
      overflow-y: auto;
      background: var(--paper-2);
      border: 1px solid var(--rule-strong);
      border-left: 5px solid var(--sheet-bar);
      border-radius: 20px;
      padding: 30px 34px 32px;
      box-shadow: 0 24px 80px -20px rgba(0, 0, 0, 0.8);
      animation: sheetPop 240ms cubic-bezier(0.34, 1.4, 0.64, 1) both;
      --sheet-bar: var(--cobalt);
    }
    #cal-sheet .sheet.source-family { --sheet-bar: var(--ochre); }
    #cal-sheet .sheet.source-elul   { --sheet-bar: var(--cobalt); }
    #cal-sheet .sheet.source-school { --sheet-bar: var(--sage); }
    #cal-sheet .sheet.source-lior   { --sheet-bar: var(--terracotta); }
    @keyframes sheetPop {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    #cal-sheet .sh-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--rule-strong);
      background: var(--paper-3);
      color: var(--ink-soft);
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 700;

    #cal-sheet .sh-day {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 18px;
    }
    /* The whole point of the sheet: the title, uncropped. No line clamp. */
    #cal-sheet .sh-title {
      font-family: var(--serif);
      font-size: clamp(28px, 3.2vw, 40px);
      font-weight: 600;
      line-height: 1.14;
      color: var(--ink);

    #cal-sheet .sh-loc {

      font-size: 16px;

    #cal-sheet .sh-desc {
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.5;

       This one MAY scroll: it is a deliberate modal, not the routine card. */
    #cal-sheet .sh-list { margin-top: 4px; }
    #cal-sheet .sh-row {
      display: flex;
      align-items: baseline;

       is a whole day — so "+3 more today" can open a list of 9. Dimming what
       has already happened keeps the two readings consistent at a glance. */
    #cal-sheet .sh-row.past .t,

      position: relative;

      align-items: center;

    }

      position: absolute;
      font-size: 12px;
      line-height: 1;
    }
    .exit-label {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      letter-spacing: 0.06em;
      line-height: 1;
    }
    /* ── Corner controls during routine windows ──
       While a routine is on, the checklist owns the panel edge to edge, and
       both fixed corner pills sit on top of it — #exit-corner was covering
       the right end of Tamar's last row (2026-09-07). During morning/evening
       they collapse to icon-only pucks: same actions, same handlers, 48px
       touch target, ~1/5th the footprint. Outside routine windows they keep
       their labels, where nothing is underneath them. */
    body[data-mode="morning"] #exit-corner,
    body[data-mode="evening"] #exit-corner,
    body[data-mode="morning"] #spotify-corner,
    body[data-mode="evening"] #spotify-corner {
      gap: 0;
      padding: 12px;
      border-radius: 50%;

    body[data-mode="morning"] #exit-corner .exit-label,
    body[data-mode="evening"] #exit-corner .exit-label,
    body[data-mode="morning"] #spotify-corner .sp-corner-label,
    body[data-mode="evening"] #spotify-corner .sp-corner-label {
      display: none;
    }
    /* 22px glyph + 12px padding + 1px border a side = 48px puck, over the
       40px touch floor. */
    body[data-mode="morning"] #spotify-corner .sp-corner-icon,
    body[data-mode="evening"] #spotify-corner .sp-corner-icon {
      font-size: 22px;
    }
    /* With the label gone the glyph carries the whole affordance, so it grows. */
    body[data-mode="morning"] #exit-corner .exit-icon,
    body[data-mode="evening"] #exit-corner .exit-icon {
      font-size: 15px;
    }
    /* Press-to-reveal (2026-09-07). Collapsing to a puck cost the exit button
       its "HOLD TO EXIT" text — the only thing distinguishing it from the
       Spotify puck beside it, which is a plain tap. Two identical-looking
       controls with different interaction models is the actual confusion, so
       pressing this one says what it wants: the puck expands back to a pill
       reading "Hold to exit" while the ring fills. Costs nothing at rest, and
       it can't overlap the checklist because it only exists under a finger.
       `.holding` is added on touchstart/mousedown by the exit-hold JS. */
    body[data-mode="morning"] #exit-corner.holding,
    body[data-mode="evening"] #exit-corner.holding {
      gap: 9px;
      padding: 10px 16px 10px 11px;
      border-radius: 999px;
    }
    body[data-mode="morning"] #exit-corner.holding .exit-label,
    body[data-mode="evening"] #exit-corner.holding .exit-label {

    body[data-mode="morning"] #exit-corner.holding .exit-sublabel,

        gap: 14px;
      }

      .right    { grid-row: 4; grid-column: 1; }

  <script>
    // ---------- Config ----------
    // Weather via Open-Meteo — free, no API key, CORS-enabled (2026-07-14).
    // Replaced OpenWeather, whose key had to sit in this public source. Keyless
    // now, so nothing to leak, proxy, or rotate. London coords.
    const WEATHER_LAT = 51.5074, WEATHER_LON = -0.1278;
    const TZ = "Europe/London";

    // ---------- HTML escape (used anywhere we inject API-sourced strings) ----------
    // Minimal implementation — old Portal Chromium lacks a native one and several
    // renderers (TFL arrivals, Stars card) inject remote strings into innerHTML.
    function escapeHtml(s) {
      if (s == null) return "";
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // ---------- Clock + greeting ----------
    function tick() {
      const now = new Date();
      const time = new Intl.DateTimeFormat("en-GB", {
        timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false
      }).format(now);
      document.getElementById("clock").textContent = time;

      const date = new Intl.DateTimeFormat("en-GB", {
        timeZone: TZ, weekday: "long", day: "numeric", month: "long", year: "numeric"
      }).format(now);
      document.getElementById("date").textContent = date;

      // Compact short-form date for the calendar eyebrow (replaces "ALMANAC TODAY").
      const calDate = new Intl.DateTimeFormat("en-GB", {
        timeZone: TZ, weekday: "short", day: "numeric", month: "short"
      }).format(now);
      const calDateEl = document.getElementById("cal-date");
      if (calDateEl) calDateEl.textContent = calDate.toUpperCase();

      const hour = parseInt(new Intl.DateTimeFormat("en-GB", {
        timeZone: TZ, hour: "2-digit", hour12: false
      }).format(now), 10);
      let g = "Good evening";
      if (hour < 5) g = "Good night";
      else if (hour < 12) g = "Good morning";
      else if (hour < 18) g = "Good afternoon";
      document.getElementById("greeting").textContent = g + ", Rifman family";
    }
    tick();
    setInterval(tick, 1000);

    // ---------- To-Do removed 2026-05-10 (B′ redesign) ----------
    // Family uses Google Keep on phones for shared notes — the dashboard no
    // longer surfaces a writeable list. Apps Script endpoint kept alive in
    // case we ever want a read-only "today's notes" callout.

    // ---------- Weather ----------
    // WMO weather codes (Open-Meteo) → emoji + label. Ranges collapse to one
    // glyph for kitchen-distance glanceability.
    function wmo(code) {
      const c = Number(code);
      if (c === 0) return { icon: "☀️", desc: "clear sky" };
      if (c === 1) return { icon: "🌤️", desc: "mainly clear" };
      if (c === 2) return { icon: "⛅", desc: "partly cloudy" };
      if (c === 3) return { icon: "☁️", desc: "overcast" };
      if (c === 45 || c === 48) return { icon: "🌫️", desc: "fog" };
      if (c >= 51 && c <= 57) return { icon: "🌦️", desc: "drizzle" };

          + `&daily=temperature_2m_max,temperature_2m_min&timezone=${encodeURIComponent(TZ)}&forecast_days=1`;

    async function loadHourly() {

          + `&hourly=temperature_2m,weather_code&timezone=${encodeURIComponent(TZ)}&forecast_days=2`;

    // ---------- Routines (per-kid, daily reset, time-windowed) ----------

    function celebrationKey(kid) { return `celebrated:${todayKey()}:${kid}`; }

    function renderRoutines() {

    // ---------- Routine fit guard ----------

                    `${Math.round(worst)}px. See the vertical budget in AGENTS.md.`;

    function nowMinutesLondon() {

        });

        if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);

    // ---------- Calendar (block-agenda view, via Vercel proxy) ----------

    async function loadCalendar() {

      // demoEvents() below for what it covers and why.

      } catch (_) {}

    var _calEvents = [];

    // ── Detail sheet ────────────────────────────────────────────────────────

    const SHEET_AUTO_CLOSE_MS = 15000;
