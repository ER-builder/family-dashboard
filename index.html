      el.classList.add("open");
      card.scrollTop = 0;

      // Reset, never stack — a second tap must not inherit the first timer and
      // shut the sheet a second after it opened.
      if (_sheetTimer) clearTimeout(_sheetTimer);
      _sheetTimer = setTimeout(closeSheet, SHEET_AUTO_CLOSE_MS);
    }

    function openEventSheet(ev) {
      const start = new Date(ev.start);
      openSheet(function (card) {
        if (ev.source) {
          const s = document.createElement("div");
          s.className = "sh-src";
          s.textContent = ev.source;
          card.appendChild(s);
        }
        const when = document.createElement("div");
        when.className = "sh-when";
        if (ev.allDay) {
          when.appendChild(document.createTextNode("All day"));
        } else {
          when.appendChild(document.createTextNode(
            fmtTime(start) + " \u2013 " + fmtTime(new Date(ev.end))));
          const d = document.createElement("span");
          d.className = "d";
          d.textContent = fmtDuration(start.getTime(), new Date(ev.end).getTime());
          when.appendChild(d);
        }
        card.appendChild(when);

        const day = document.createElement("div");
        day.className = "sh-day";
        day.textContent = dayLabelFor(start) + " \u00b7 " + shortDayHead(start);
        card.appendChild(day);

        // The reason the sheet exists: the title, uncropped, base direction
        // resolved per-title so Hebrew reads correctly.
        const t = document.createElement("div");
        t.className = "sh-title";
        t.setAttribute("dir", "auto");
        t.textContent = ev.title;
        card.appendChild(t);

        if (ev.location) {
          const loc = document.createElement("div");
          loc.className = "sh-loc";
          loc.setAttribute("dir", "auto");
          loc.textContent = "\ud83d\udccd " + ev.location;
          card.appendChild(loc);
        }
        // Only rendered if the proxy passes iCal DESCRIPTION through; it may
        // not, and the sheet is fine without it.
        if (ev.description) {
          const de = document.createElement("div");
          de.className = "sh-desc";
          de.setAttribute("dir", "auto");
          de.textContent = String(ev.description).trim().slice(0, 600);
          card.appendChild(de);
        }
      }, sourceClass(ev));
    }

    function openDaySheet(label, dateObj, items) {
      openSheet(function (card) {
        const day = document.createElement("div");
        day.className = "sh-day";
        day.textContent = label + " \u00b7 " + shortDayHead(dateObj);
        card.appendChild(day);

        const t = document.createElement("div");
        t.className = "sh-title";
        t.textContent = items.length + (items.length === 1 ? " event" : " events");
        card.appendChild(t);

        const list = document.createElement("div");
        list.className = "sh-list";
        const nowM = nowMinutesLondon();
        const isToday = dayKey(dateObj) === dayKey(new Date());
        items.forEach(function (ev) {
          const row = document.createElement("div");
          row.className = "sh-row";
          // Only today can contain past events; tomorrow never does.
          if (isToday && !ev.allDay && londonMins(new Date(ev.end)) <= nowM) {
            row.className += " past";
          }
          const tm = document.createElement("div");
          tm.className = "t";
          tm.textContent = ev.allDay ? "all day" : fmtTime(new Date(ev.start));
          row.appendChild(tm);
          const n = document.createElement("div");
          n.className = "n";
          n.setAttribute("dir", "auto");
          n.textContent = ev.title;
          row.appendChild(n);
          // Drill into one event. stopPropagation, or the backdrop handler
          // below closes the sheet on the way up.
          row.addEventListener("click", function (e) {
            e.stopPropagation();
            openEventSheet(ev);
          });
          list.appendChild(row);
        });
        card.appendChild(list);
      }, "");
    }

    (function initSheet() {
      const el = document.getElementById("cal-sheet");
      if (!el) return;
      // Tap anywhere — backdrop or card — to close. Children that mean
      // something else (rows, the × button) stopPropagation.
      el.addEventListener("click", function () { closeSheet(); });
    })();

    function moreButton(label, onTap) {
      const b = document.createElement("button");
      b.className = "cal-more";
      b.textContent = label;
      b.addEventListener("click", function (e) { e.stopPropagation(); onTap(); });
      return b;
    }

    // ── Blocks ──────────────────────────────────────────────────────────────
    function makeBlock(ev, opts) {
      opts = opts || {};
      const block = document.createElement("div");
      let cls = "block" + sourceClass(ev);
      if (opts.now) cls += " now";
      block.className = cls;
      block.setAttribute("role", "button");

      // Source-color bar is rendered via .block::before (CSS pseudo). Don't
      // append a real .bar div: old Portal Chromium auto-places abs-positioned
      // children oddly, and it bit us here once already (2026-05-11).

      const meta = document.createElement("div");
      meta.className = "meta";

      const when = document.createElement("div");
      when.className = "when";
      when.textContent = ev.allDay ? "all day" : fmtTime(new Date(ev.start));
      meta.appendChild(when);

      if (!ev.allDay) {
        const dur = document.createElement("div");
        dur.className = "dur";
        dur.textContent = fmtDuration(new Date(ev.start).getTime(), new Date(ev.end).getTime());
        meta.appendChild(dur);
      }
      if (ev.source) {
        const s = document.createElement("div");
        s.className = "src";
        s.textContent = ev.source;
        meta.appendChild(s);
      }
      block.appendChild(meta);

      const ti = document.createElement("div");
      ti.className = "ti";
      // 2026-09-08: calendar titles had no `dir` at all, so Hebrew rendered
      // with an LTR base direction and trailing punctuation/digits landed on
      // the wrong side. `auto` resolves it per title, free.
      ti.setAttribute("dir", "auto");
      ti.textContent = ev.title;
      block.appendChild(ti);

      // Single `click` handler. Never pair it with a `touchend` that calls
      // preventDefault() — that suppresses the synthetic click on Portal's
      // Chromium and produces intermittent dead taps (2026-05-17 hardening).
      // CSS carries `touch-action: manipulation` so there's no tap delay.
      block.addEventListener("click", function () { openEventSheet(ev); });
      return block;
    }

    function renderCalendar(events) {
      _calEvents = events || [];
      const allDayEl = document.getElementById("cal-allday");
      const agendaEl = document.getElementById("agenda");
      if (!allDayEl || !agendaEl) return;
      while (allDayEl.firstChild) allDayEl.removeChild(allDayEl.firstChild);
      while (agendaEl.firstChild) agendaEl.removeChild(agendaEl.firstChild);

      const mode = document.body.getAttribute("data-mode") || "spotify";
      const today = dayKey(new Date());
      const tomorrowDate = new Date(Date.now() + 86400000);
      const tomorrow = dayKey(tomorrowDate);
      const todayAllDay = [];
      const todayTimed = [];
      const tomorrowItems = [];
      for (const ev of _calEvents) {
        const start = new Date(ev.start);
        const k = dayKey(start);
        if (k === today) {
          (ev.allDay ? todayAllDay : todayTimed).push(ev);
        } else if (k === tomorrow) {
          tomorrowItems.push(ev);
        }
      }
      // Sort by start asc
      todayTimed.sort((a, b) => new Date(a.start).getTime() - new Date(b.start).getTime());
      tomorrowItems.sort((a, b) => new Date(a.start).getTime() - new Date(b.start).getTime());

      // ─── All-day chips
      todayAllDay.forEach(ev => {
        const c = document.createElement("div");
        c.className = "chip" + sourceClass(ev);
        c.textContent = ev.title;
        allDayEl.appendChild(c);
      });

      // ─── Today: split into Now / Up Next
      const nowMins = nowMinutesLondon();
      const happeningNow = [];
      const upcoming = [];
      todayTimed.forEach(ev => {
        const sM = londonMins(new Date(ev.start));
        const eM = londonMins(new Date(ev.end));
        if (sM <= nowMins && nowMins < eM) {
          happeningNow.push(ev);
        } else if (sM > nowMins) {
          upcoming.push(ev);
        }
        // events fully in the past are dropped — the agenda is forward-looking
      });

      function addSection(label, opts, items) {
        if (!items.length) return;
        const head = document.createElement("div");
        head.className = "section-head" + (opts && opts.now ? " now" : "");
        head.textContent = (opts && opts.now ? "\u258c " : "") + label;
        agendaEl.appendChild(head);
        items.forEach(ev => {
          agendaEl.appendChild(makeBlock(ev, opts || {}));
        });
      }

      addSection("Now", { now: true }, happeningNow);

      // Rendered today-blocks in order — fitAgenda() pops from the end.
      const todayNodes = [];
      const cap = todayCap(mode, happeningNow.length > 0);
      if (upcoming.length) {
        const head = document.createElement("div");
        head.className = "section-head";
        head.textContent = "Up Next";
        agendaEl.appendChild(head);
        upcoming.slice(0, cap).forEach(function (ev) {
          const b = makeBlock(ev, {});
          todayNodes.push(b);
          agendaEl.appendChild(b);
        });
      }
      // Always created, so it holds its slot in the DOM: fitAgenda() only has
      // to flip its label and visibility as it trims.
      const todayMore = moreButton("", function () {
        openDaySheet("Today", new Date(), todayAllDay.concat(todayTimed));
      });
      agendaEl.appendChild(todayMore);

      const tomorrowNodes = [];
      let tomorrowMore = null;

      // ─── Tomorrow: a strip most of the day, real blocks in the evening.
      if (tomorrowItems.length) {
        const wrap = document.createElement("div");
        wrap.className = "cal-tomorrow";

        const head = document.createElement("div");
        head.className = "day-head";
        head.appendChild(document.createTextNode("Tomorrow"));
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.textContent = "\u00b7 " + shortDayHead(tomorrowDate);
        head.appendChild(dot);
        wrap.appendChild(head);

        const openTomorrow = function () {
          openDaySheet("Tomorrow", tomorrowDate, tomorrowItems);
        };

        if (mode === "evening") {
          // 15:30–20:30: tomorrow is the point. Expand it, and let the head
          // still reach the full list.
          head.addEventListener("click", openTomorrow);
          tomorrowItems.slice(0, TOMORROW_EXPANDED_CAP).forEach(function (ev) {
            const b = makeBlock(ev, {});
            tomorrowNodes.push(b);
            wrap.appendChild(b);
          });
          tomorrowMore = moreButton("", openTomorrow);
          wrap.appendChild(tomorrowMore);
        } else {
          const sum = document.createElement("div");
          sum.className = "tsum";
          const n = tomorrowItems.length;
          let txt = n + (n === 1 ? " event" : " events");
          const first = tomorrowItems[0];
          if (first && !first.allDay) txt += " \u00b7 from " + fmtTime(new Date(first.start));
          sum.appendChild(document.createTextNode(txt));
          const chev = document.createElement("span");
          chev.className = "chev";
          chev.textContent = "\u203a";
          sum.appendChild(chev);
          wrap.appendChild(sum);
          // Nothing inside the collapsed strip has its own handler, so one on
          // the wrapper is the whole tap target.
          wrap.className += " tappable";
          wrap.addEventListener("click", openTomorrow);
        }
        agendaEl.appendChild(wrap);
      }

      if (!todayAllDay.length && !todayTimed.length && !tomorrowItems.length) {
        const empty = document.createElement("div");
        empty.className = "cal-empty";
        empty.textContent = "A quiet stretch ahead.";
        agendaEl.appendChild(empty);
      }

      fitAgenda({
        today:    { nodes: todayNodes,    total: upcoming.length,      pill: todayMore,    word: " more today" },
        tomorrow: { nodes: tomorrowNodes, total: tomorrowItems.length, pill: tomorrowMore, word: " more" }
      }, mode);
      checkAgendaFit();
    }

    /* The caps above are a starting point, not the answer. Titles wrap to two
       lines unpredictably, and — the thing that has burned this repo before —
       the webfonts have different metrics from a dev browser's fallbacks, so a
       static cap that fits on a laptop can still clip on Terry. Render
       optimistically, then measure and trim until it genuinely fits.

       Trims tomorrow before today (today outranks it, even in the evening),
       never drops the last block of a section, and never touches "Now".
       Nothing is lost: trimmed events roll into the "+n more" pill. */
    /* How far the agenda runs past the space it is allowed, in px.

       NOT scrollHeight - clientHeight: Chromium leaves bottom padding out of
       scrollHeight, so the corner-button clearance (padding-bottom on
       .calendar .body) read as *extra* room and the fitter happily laid content
       under the Spotify pill. Compare real geometry instead — the bottom of the
       agenda against the bottom of the body's content box. */
    function agendaOverflow() {
      const body = document.getElementById("cal-body");
      const agenda = document.getElementById("agenda");
      if (!body || !agenda) return 0;
      const padB = parseFloat(getComputedStyle(body).paddingBottom) || 0;
      const limit = body.getBoundingClientRect().bottom - padB;
      return agenda.getBoundingClientRect().bottom - limit;
    }

    function fitAgenda(sections, mode) {
      // Who gives first. Outside the evening, tomorrow is a one-line strip with
      // nothing to give, so this only really bites in evening mode — where
      // tomorrow is the whole reason the section expanded, and today (already
      // capped at 2) should shed a row before it does.
      const order = mode === "evening"
        ? [sections.today, sections.tomorrow]
        : [sections.tomorrow, sections.today];
      sections.today.floor = 1;
      sections.tomorrow.floor = 1;

      function relabel(sec) {
        if (!sec.pill) return;
        const hidden = sec.total - sec.nodes.length;
        sec.pill.textContent = hidden > 0 ? "+" + hidden + sec.word : "";
        sec.pill.style.display = hidden > 0 ? "" : "none";
      }
      order.forEach(relabel);

      /* Strict: any overflow at all is either a scrollbar or a row hidden
         under the corner button, and "neither of those" is the rule the whole
         layout ladders up to. 0.5px of slack for sub-pixel rounding, and a
         guard because every pass must remove a node — there are only ever a
         handful, so 16 is far past enough. */
      let guard = 16;
      while (agendaOverflow() > 0.5 && guard-- > 0) {
        let trimmed = false;
        for (let i = 0; i < order.length; i++) {
          const sec = order[i];
          // Tomorrow may give up its last expanded block (it falls back to the
          // head plus a "+n more" tap, which is the collapsed strip's job
          // anyway). Today always keeps at least one.
          if (sec.nodes.length > sec.floor) {
            const node = sec.nodes.pop();
            if (node.parentNode) node.parentNode.removeChild(node);
            relabel(sec);
            trimmed = true;
            break;
          }
        }
        if (!trimmed) {
          // Last resort: let the expanded Tomorrow collapse to just its head
          // and a "+n more" tap, which is what the strip does anyway.
          if (sections.tomorrow.floor > 0) { sections.tomorrow.floor = 0; continue; }
          break;   // genuinely nothing left — checkAgendaFit() says so
        }
      }
    }

    // Sibling of checkRoutineFit(). The agenda keeps `overflow-y: auto` as a
    // safety valve — a scrollbar here is ugly, not broken, unlike the routine
    // card — but it should never actually be needed, so say so when it is.
    function checkAgendaFit() {
      const over = agendaOverflow();
      if (over <= 1) return;
      const msg = "Calendar agenda overflows by " + Math.round(over) + "px (mode=" +
                  (document.body.getAttribute("data-mode") || "?") + "). See the vertical " +
                  "budget in AGENTS.md \u2014 give back an Up Next cap, not a type size.";
      console.warn(msg);
      if (/[?&]debug=fit/.test(location.search)) {
        // Reuse one node: this runs on every render and every 60s tick.
        let el = document.getElementById("agenda-fit-warn");
        if (!el) {
          el = document.createElement("div");
          el.id = "agenda-fit-warn";
          el.style.cssText = "position:fixed;left:8px;bottom:118px;z-index:99999;max-width:420px;" +
            "background:#c8553d;color:#fff;font:700 12px/1.4 monospace;padding:6px 10px;border-radius:6px;";
          document.body.appendChild(el);
        }
        el.textContent = msg;
      }
    }

    // ?cal=demo — a fixture instead of the proxy, so the layout can be checked
    // on a laptop at 1280×800 without waiting on real family data. Covers the
    // cases that actually break things: a long English title, a long RTL
    // Hebrew title, an all-day chip, a live "Now" event, and enough events to
    // trip both "+n more" pills. Anchored to the current time, so running it
    // across midnight gives odd results — it's a dev tool, not a feature.
    function demoEvents() {
      const now = Date.now();
      const mk = (startMin, durMin, title, source, extra) => Object.assign({
        title: title,
        source: source,
        start: new Date(now + startMin * 60000).toISOString(),
        end: new Date(now + (startMin + durMin) * 60000).toISOString(),
        allDay: false
      }, extra || {});
      return [
        // Two events that already finished — they never reach the agenda (it is
        // forward-looking) but they do reach the Today day sheet, where they
        // must render dimmed.
        mk(-240, 45, "School drop-off", "Family"),
        mk(-150, 60, "Standup + sprint planning", "Elul"),
        mk(-20, 40, "\u05d4\u05de\u05e2\u05e8\u05db\u05ea \u05e9\u05dc \u05ea\u05de\u05e8 \u2014 \u05d7\u05d6\u05e8\u05d4 \u05db\u05dc\u05dc\u05d9\u05ea", "Family",
           { location: "School hall" }),
        mk(0, 0, "Bins out \u2014 recycling week", "Family", { allDay: true }),
        mk(35, 30, "Commute to the office", "Elul"),
        mk(95, 45, "Year 4 Meet the Teacher evening", "School",
           { location: "Room 4B, main building" }),
        mk(150, 60, "\u05e8\u05d0\u05d9\u05d5\u05df \u05dc\u05de\u05e9\u05e8\u05ea \u05de\u05e0\u05d4\u05dc \u05d4\u05e4\u05d9\u05ea\u05d5\u05d7", "Elul"),
        mk(220, 90, "Tamar \u2014 forest school pickup", "Lior"),
        mk(300, 60, "Eitan \u2014 football game", "Lior"),
        mk(380, 60, "Dinner with the Cohens", "Family"),
        // Tomorrow
        mk(24 * 60 - 30, 30, "\u05d4\u05de\u05e2\u05e8\u05db\u05ea", "Family"),
        mk(24 * 60 + 30, 45, "Year 4 Meet the Teacher", "School"),
        mk(24 * 60 + 200, 30, "Swimming lesson", "Lior"),
        mk(24 * 60 + 330, 60, "\u05d9\u05d5\u05dd \u05d4\u05d5\u05dc\u05d3\u05ea \u05dc\u05d0\u05d9\u05ea\u05df \u2014 \u05de\u05e1\u05d9\u05d1\u05d4 \u05d1\u05d2\u05df", "Family"),
        mk(24 * 60 + 420, 90, "Parents' evening", "School")
      ];
    }

    loadCalendar();
    // 2026-05-17: 5min → 30min. Calendar events change rarely (family adds
    // them via Google Cal on phones); proxy caches 60min anyway, so polling
    // faster than that just wasted Vercel CPU. 30min worst-case visibility
    // lag for "wife added an event" is acceptable for a kitchen dashboard.
    setInterval(loadCalendar, 30 * 60 * 1000);
    /* Re-render once the webfonts have settled. Two reasons, both real:

       1. Font metrics are part of the budget. Measured 2026-09-08 in headless
          Chromium, the same demo block was 50.7px tall with the fallback stack
          and 66.1px once the real cascade applied — fitAgenda() has to run
          against the fonts the kitchen actually sees, not the ones present a
          second after boot.
       2. The Now / Up Next split was only recomputed when the calendar polled,
          i.e. every 30 minutes. An event that started ten minutes ago sat under
          "Up Next" until the next poll. Re-rendering on the minute tick (see
          reflowCalendar below) fixes that for free — it is the same cached
          payload and a handful of DOM nodes. */
    setTimeout(reflowCalendar, 2500);

    // Rebuild from the cached payload — never when a load has yet to succeed,
    // or we would paint "A quiet stretch ahead." over "Calendar unavailable".
    function reflowCalendar() {
      if (!_calLoaded) return;
      renderCalendar(_calEvents);
    }
    // DevTools handle, in the spirit of window.__selfUpdateCheck() — force a
    // re-layout after poking at CSS on the device.
    window.__calReflow = reflowCalendar;
    window.__agendaOver = agendaOverflow;

    // ---------- TfL transit (Northern Line + Bus 102) ----------
    // TfL severity scale: 10 = Good Service, 9 = Minor Delays, 6 or below = Severe.
    //
    // Live bus arrivals: fill in TFL_STOPS with stop IDs from
    //   https://tfl.gov.uk/bus/route/102/  → click stop on map → URL contains the StopID.
    // Stop IDs are short codes like "490004733E" (letter at end = direction).
    const TFL_STOPS = [
      { id: "490004463E", route: "102", dest: "East Finchley" },
      { id: "490004463W", route: "102", dest: "Golders Green" },
    ];

    // Cache scheduled timetables for the day so we don't refetch every 30s.
    const _tflTimetableCache = {}; // key: stopId|route|YYYY-MM-DD → ["HH:MM", ...]
    async function fetchScheduledTimes(stop) {
      const today = new Date().toLocaleDateString("en-CA", { timeZone: TZ });
      const key = `${stop.id}|${stop.route}|${today}`;
      if (_tflTimetableCache[key]) return _tflTimetableCache[key];
      try {
        const res = await fetch(`https://api.tfl.gov.uk/Line/${stop.route}/Timetable/${stop.id}`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        // Find today's schedule by name match (e.g. "Friday", "Mon-Fri", "Saturday").
        const todayName = new Date().toLocaleDateString("en-GB", { timeZone: TZ, weekday: "long" });
        const schedules = data?.timetable?.routes?.[0]?.schedules || [];
        const today3 = todayName.slice(0, 3);
        const match = schedules.find(s => {
          const n = (s.name || "").toLowerCase();
          return n.includes(todayName.toLowerCase())
              || n.includes(today3.toLowerCase())
              || (today3 !== "Sat" && today3 !== "Sun" && /mon-?fri|weekday/.test(n));
        }) || schedules[0];
        const journeys = match?.knownJourneys || [];
        const times = journeys.map(j => `${String(j.hour).padStart(2, "0")}:${String(j.minute).padStart(2, "0")}`);
        _tflTimetableCache[key] = times;
        return times;
      } catch (e) {
        return [];
      }
    }

    function nextScheduled(times, k = 3) {
      const now = new Date();
      const nowMin = now.toLocaleTimeString("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
      const [hN, mN] = nowMin.split(":").map(Number);
      const cur = hN * 60 + mN;
      return times
        .map(t => { const [h, m] = t.split(":").map(Number); return { t, mins: h * 60 + m }; })
        .filter(x => x.mins >= cur)
        .sort((a, b) => a.mins - b.mins)
        .slice(0, k);
    }

    // Sequential rewrite — no nested Promise.all, no optional chaining of array
    // index access. Old Portal Chromium occasionally chokes on these and the
    // whole render aborts silently. Keeps a tiny diagnostic line at the bottom
    // of the arrivals container so we can SEE on Terry whether render ran.
    async function loadTflArrivals() {
      const container = document.getElementById("tfl-102-arrivals");
      if (!container) return;
      if (!TFL_STOPS.length) {
        container.setAttribute("hidden", "");
        container.style.display = "none";
        return;
      }

      const rows = [];
      let liveCount = 0, schedCount = 0, errCount = 0;

      for (let si = 0; si < TFL_STOPS.length; si++) {
        const s = TFL_STOPS[si];
        let live = [];
        let stopErr = false;
        try {
          const res = await fetch(
            "https://api.tfl.gov.uk/StopPoint/" + encodeURIComponent(s.id) + "/Arrivals?mode=bus",
            { cache: "no-store" }
          );
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (Array.isArray(data)) {
            live = data.filter(function (a) { return a && a.lineId === s.route; })
                       .sort(function (a, b) { return a.timeToStation - b.timeToStation; })
                       .slice(0, 3);
          }
        } catch (e) {
          stopErr = true;
        }

        const dest = "→ " + escapeHtml(s.dest);

        if (stopErr) {
          errCount++;
          rows.push('<div class="arr-row"><span class="dest">' + dest + '</span><span class="none">offline</span></div>');
          continue;
        }

        if (live.length) {
          liveCount += live.length;
          const parts = [];
          for (let i = 0; i < live.length; i++) {
            const mins = Math.round(live[i].timeToStation / 60);
            const cell = (mins <= 0)
              ? '<span class="t due">Due</span>'
              : '<span class="t">' + mins + '<span class="u">min</span></span>';
            parts.push((i > 0 ? '<span class="sep">·</span>' : '') + cell);
          }
          rows.push('<div class="arr-row"><span class="dest">' + dest + '</span><span class="times">' + parts.join(' ') + '</span></div>');
          continue;
        }

        // Live empty → schedule fallback
        let sched = [];
        try { sched = await fetchScheduledTimes(s); } catch (_) { sched = []; }
        const upcoming = nextScheduled(sched, 3);
        if (!upcoming.length) {
          rows.push('<div class="arr-row"><span class="dest">' + dest + '</span><span class="none">no buses today</span></div>');
          continue;
        }
        schedCount += upcoming.length;
        const nowM = nowMinutesLondon();
        const sparts = [];
        for (let i = 0; i < upcoming.length; i++) {
          const delta = upcoming[i].mins - nowM;
          let cell;
          if (delta <= 0)       cell = '<span class="t due">Due</span>';
          else if (delta < 60)  cell = '<span class="t sched">' + delta + '<span class="u">min</span></span>';
          else                  cell = '<span class="t sched">' + escapeHtml(upcoming[i].t) + '</span>';
          sparts.push((i > 0 ? '<span class="sep">·</span>' : '') + cell);
        }
        rows.push('<div class="arr-row"><span class="dest">' + dest + '</span><span class="times">' + sparts.join(' ') + '<span class="sched-tag">scheduled</span></span></div>');
      }

      container.innerHTML = rows.join("");
      container.removeAttribute("hidden");
      container.style.display = "";

      // If we got LIVE arrivals (predictions, not just scheduled), hide the
      // line's "Good Service" pill — the live times convey the same info more
      // usefully. If only scheduled fallback or all errors, keep the pill so
      // the user still has the line-status signal.
      const tfl102 = document.getElementById("tfl-102");
      if (tfl102) {
        if (liveCount > 0) tfl102.classList.add("has-arrivals");
        else               tfl102.classList.remove("has-arrivals");
      }
    }

    async function loadTfl() {
      const lines = [
        { id: "northern", el: "tfl-northern" },
        { id: "102",      el: "tfl-102" }
      ];
      await Promise.all(lines.map(async ({ id, el }) => {
        const row = document.getElementById(el);
        const span = row && row.querySelector(".status");
        if (!span) return;
        try {
          const res = await fetch(`https://api.tfl.gov.uk/Line/${id}/Status`, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          const desc = data?.[0]?.lineStatuses?.[0]?.statusSeverityDescription || "Unknown";
          const sev  = data?.[0]?.lineStatuses?.[0]?.statusSeverity ?? 10;
          const tone = sev >= 10 ? "good" : sev >= 7 ? "minor" : "severe";
          span.textContent = desc;
          span.classList.remove("good", "minor", "severe");
          span.classList.add(tone);
        } catch (e) {
          span.textContent = "Unavailable";
          span.classList.remove("good", "minor");
          span.classList.add("severe");
        }
      }));
    }
    loadTfl();
    setInterval(loadTfl, 5 * 60 * 1000); // line status every 5 min
    loadTflArrivals();
    setInterval(loadTflArrivals, 30 * 1000); // bus arrivals every 30s

    // ---------- Live radio (Kan Reshet Bet) ----------
    // Plays in the page rather than launching Chromium: a browser would be
    // yanked back by the kiosk's flat 2-min AUTO_RETURN (only Spotify is
    // music-gated), and exempting it would mean an APK rebuild.
    //
    // URLs came off Kan's own Video.js player (2026-09-07). Both formats are
    // served from one origin and neither carries a token or expiry, so they
    // can live here as constants. HLS is what we use — Android's media stack
    // handles it natively in most builds; hls.js is the fallback for when it
    // doesn't, fetched only on demand so it costs nothing at boot.
    const RADIO_HLS  = "https://kancdn.medonecdn.net/livehls/oil/kancdn-live/live/radio/kan_reshet_bet/live.livx/playlist.m3u8?renditions&dvr=7200000";
    const RADIO_HLSJS = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";

    (function() {
      const wrap  = document.querySelector(".cs-radio");
      const btn   = document.getElementById("radio-btn");
      const audio = document.getElementById("radio-audio");
      const glyph = document.getElementById("radio-glyph");
      const sub   = document.getElementById("radio-sub");
      if (!wrap || !btn || !audio) return;

      let hls = null;              // hls.js instance, only if we need one
      let watchdog = null;
      // Bumped on every play/stop. Async callbacks (script load, watchdog,
      // media errors) capture it and no-op if they're from an attempt the
      // user has already moved on from — otherwise a slow hls.js 404 can
      // paint "unavailable" over a player that was stopped ages ago.
      let session = 0;

      function setState(state, label) {
        wrap.setAttribute("data-state", state);
        glyph.textContent = (state === "playing") ? "■" : "▶";
        if (sub) sub.textContent = label;
      }
      setState("idle", "live");

      // Public so the Spotify poll and the self-update check can see it.
      window.__radioPlaying = function() { return wrap.getAttribute("data-state") === "playing"; };

      function stop() {
        session++;
        if (watchdog) { clearTimeout(watchdog); watchdog = null; }
        try { audio.pause(); } catch (_) {}
        if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
        audio.removeAttribute("src");
        try { audio.load(); } catch (_) {}   // release the stream
        setState("idle", "live");
      }
      window.__radioStop = stop;

      // Live HLS with a 2h DVR window starts at the window's beginning on some
      // players, which would put us two hours behind. Always jump to the edge.
      function seekToLive() {
        try {
          const sk = audio.seekable;
          if (sk && sk.length) {
            const end = sk.end(sk.length - 1);
            if (isFinite(end) && end - audio.currentTime > 30) audio.currentTime = end - 3;
          }
        } catch (_) {}
      }
      audio.addEventListener("loadedmetadata", seekToLive);
      audio.addEventListener("playing", function() {
        if (watchdog) { clearTimeout(watchdog); watchdog = null; }
        seekToLive();
        setState("playing", "on air");
      });
      audio.addEventListener("error", function() { fail(session); });

      function fail(my) {
        if (my !== undefined && my !== session) return;   // stale attempt
        if (wrap.getAttribute("data-state") === "idle") return;  // already stopped
        if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
        if (watchdog) { clearTimeout(watchdog); watchdog = null; }
        try { audio.pause(); } catch (_) {}
        setState("error", "off air");
        console.warn("[radio] could not play", RADIO_HLS);
        setTimeout(function() {
          if (wrap.getAttribute("data-state") === "error") setState("idle", "live");
        }, 6000);
      }

      function viaHlsJs(my) {
        function attach() {
          if (my !== session) return;
          if (!window.Hls || !window.Hls.isSupported()) { fail(my); return; }
          hls = new window.Hls({ liveDurationInfinity: true });
          hls.on(window.Hls.Events.ERROR, function(_e, data) { if (data && data.fatal) fail(my); });
          hls.loadSource(RADIO_HLS);
          hls.attachMedia(audio);
          audio.play().catch(function() { fail(my); });
        }
        if (window.Hls) { attach(); return; }
        const tag = document.createElement("script");
        tag.src = RADIO_HLSJS;
        tag.onload = attach;
        tag.onerror = function() { fail(my); };
        document.head.appendChild(tag);
      }

      function play() {
        const my = ++session;
        setState("loading", "tuning…");
        // If anything is coming out of Spotify, don't stack two sources.
        if (typeof _spIsPlaying !== "undefined" && _spIsPlaying) {
          try { spCommand("pause"); } catch (_) {}
        }
        // 12s to produce sound, else treat it as a failure rather than
        // sitting on "connecting…" forever.
        watchdog = setTimeout(function() {
          if (my !== session) return;
          if (wrap.getAttribute("data-state") !== "playing") {
            if (!hls) viaHlsJs(my); else fail(my);
          }
        }, 12000);

        const native = audio.canPlayType("application/vnd.apple.mpegurl") ||
                       audio.canPlayType("application/x-mpegURL");
        if (native) {
          audio.src = RADIO_HLS;
          audio.play().catch(function() { viaHlsJs(my); });
        } else {
          viaHlsJs(my);
        }
      }

      btn.addEventListener("click", function() {
        if (wrap.getAttribute("data-state") === "playing" ||
            wrap.getAttribute("data-state") === "loading") stop();
        else play();
      });
    })();

    // ─────────────────────────────────────────────────────────────────────────
    // SPOTIFY -- now-playing ambient card + full player card + launch button
    // ─────────────────────────────────────────────────────────────────────────
    // Proxy endpoint (Vercel). Returns { isPlaying, track, artist, albumArt, ... }
    // Set to "" to disable the feature gracefully (card stays hidden).
    const SPOTIFY_PROXY_URL = "https://family-dashboard-proxy.vercel.app/api/spotify-now";

    let _spIsPlaying = false;
    let _spPrevPlaying = false; // for false\u2192true transition detection (auto-open)
    let _spAutoCloseTimer = null;
    let _spStopGraceTimer = null; // when music stops while override is on, wait
                                  // GRACE_MS before clearing \u2014 avoids snapping
                                  // back to the routine on a brief pause.
    const SP_OVERRIDE_GRACE_MS = 30 * 1000;

    function setMusicOverride(on) {
      if (on) {
        document.body.setAttribute("data-music-override", "true");
      } else {
        document.body.removeAttribute("data-music-override");
        if (_spStopGraceTimer) { clearTimeout(_spStopGraceTimer); _spStopGraceTimer = null; }
      }
    }

    const spBigArtWrap = document.getElementById("sp-big-art-wrap");
    const spBigTrack   = document.getElementById("sp-big-track");
    const spBigArtist  = document.getElementById("sp-big-artist");
    const spPlayPause  = document.getElementById("sp-play-pause");
    const spClose      = document.getElementById("sp-close");

    function _spEscAttr(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
    }

    function renderSpotify(data) {
      _spIsPlaying = !!(data && data.isPlaying);
      // Two audio sources at once is never what anyone wants. Spotify wins:
      // starting it is a deliberate act, and the radio is one tap to resume.
      if (_spIsPlaying && window.__radioPlaying && window.__radioPlaying()) {
        try { window.__radioStop(); } catch (_) {}
      }
      const cardEl = document.getElementById("spotify-card");

      // Music override: false\u2192true transition during a routine should swap
      // the routine card out for the playing card. true\u2192false starts a grace
      // timer (don't snap back on a quick pause / track gap).
      if (_spIsPlaying && !_spPrevPlaying) {
        const mode = document.body.getAttribute("data-mode");
        if (mode === "morning" || mode === "evening") {
          setMusicOverride(true);
        }
        if (_spStopGraceTimer) { clearTimeout(_spStopGraceTimer); _spStopGraceTimer = null; }
      } else if (!_spIsPlaying && _spPrevPlaying) {
        if (document.body.getAttribute("data-music-override") === "true") {
          if (_spStopGraceTimer) clearTimeout(_spStopGraceTimer);
          _spStopGraceTimer = setTimeout(() => setMusicOverride(false), SP_OVERRIDE_GRACE_MS);
        }
      }

      if (!_spIsPlaying) {
        // B\u2032: card stays visible in idle state \u2014 no closing, no mode switch.
        // Surface last-played track so a single tap restarts it.
        if (cardEl) cardEl.setAttribute("data-state", "idle");
        if (spBigTrack)  spBigTrack.textContent  = "";
        if (spBigArtist) spBigArtist.textContent = "";

        const idleArt    = document.getElementById("sp-idle-art");
        const idleTrack  = document.getElementById("sp-idle-track");
        const idleArtist = document.getElementById("sp-idle-artist");
        const lp = data && data.lastPlayed;
        if (idleArt) {
          if (lp && lp.albumArt) {
            idleArt.style.backgroundImage = "url('" + _spEscAttr(lp.albumArt) + "')";
            idleArt.classList.add("has-art");
          } else {
            idleArt.style.backgroundImage = "";
            idleArt.classList.remove("has-art");
          }
        }
        if (idleTrack) {
          if (lp && lp.track) {
            idleTrack.textContent = lp.track;
            idleTrack.classList.remove("empty");
          } else {
            idleTrack.textContent = "Tap to play";
            idleTrack.classList.add("empty");
          }
        }
        if (idleArtist) idleArtist.textContent = (lp && lp.artist) ? lp.artist : "";

        _spPrevPlaying = false;
        return;
      }

      // Music is playing \u2014 populate live player data.
      if (cardEl) cardEl.setAttribute("data-state", "playing");
      if (spBigArtWrap) {
        // Wrap art in a relative container so the long-press launch hint
        // (⤴ glyph, top-right) anchors correctly.
        const hint = '<span class="sp-big-art-launch-hint" aria-hidden="true">&#x2197;</span>';
        if (data.albumArt) {
          spBigArtWrap.innerHTML = '<div class="sp-big-art-wrap-rel"><img class="sp-big-art" src="' + _spEscAttr(data.albumArt) + '" alt="" />' + hint + '</div>';
        } else {
          spBigArtWrap.innerHTML = '<div class="sp-big-art-wrap-rel"><div class="sp-big-art-placeholder"><span>&#x266B;</span></div>' + hint + '</div>';
        }
      }
      // Wrap track title in a <span> so the marquee CSS can translate it.
      // Toggle .marquee only when the text actually overflows the container \u2014
      // short titles stay still and centered.
      if (spBigTrack) {
        const title = data.track || "Unknown track";
        spBigTrack.innerHTML = '<span></span>';
        spBigTrack.firstChild.textContent = title;
        // Defer measurement to next frame; the span needs to lay out first.
        requestAnimationFrame(function() {
          try {
            const span = spBigTrack.firstChild;
            const overflows = span && span.scrollWidth > spBigTrack.clientWidth + 4;
            spBigTrack.classList.toggle("marquee", !!overflows);
          } catch (_) {}
        });
      }
      if (spBigArtist) spBigArtist.textContent = data.artist || "";
      if (spPlayPause) spPlayPause.textContent = data.isPlaying ? "\u23F8" : "\u25B6";
      _spPrevPlaying = true;
    }

    let _spLastErrorAt = 0;
    let _spLastSuccessAt = Date.now();

    // Visible error state — if the proxy hasn't replied successfully in 60s,
    // show a "connection retrying" line on the card so the family doesn't
    // think the dashboard is silently lying about playback. Cleared as soon
    // as the next poll succeeds.
    function _spUpdateHealthBadge() {
      try {
        const card = document.getElementById("spotify-card");
        if (!card) return;
        const staleMs = Date.now() - _spLastSuccessAt;
        card.classList.toggle("sp-stale", staleMs > 60_000);
      } catch (_) {}
    }
    setInterval(_spUpdateHealthBadge, 5_000);

    async function loadSpotify(opts) {
      if (!SPOTIFY_PROXY_URL) return;
      const fresh = !!(opts && opts.fresh);
      const url = fresh
        ? (SPOTIFY_PROXY_URL + (SPOTIFY_PROXY_URL.includes("?") ? "&" : "?") + "t=" + Date.now())
        : SPOTIFY_PROXY_URL;
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        _spLastSuccessAt = Date.now();
        renderSpotify(data);
        // Lightweight Bug-4 instrumentation: log every state change so we can
        // diagnose "Spotify randomly stops" complaints. Strip in Phase 4 if
        // noisy; keep if useful.
        if (data && typeof console !== "undefined") {
          console.warn("[sp] poll", { isPlaying: !!data.isPlaying, fresh, ts: Date.now() });
        }
      } catch (e) {
        _spLastErrorAt = Date.now();
        if (typeof console !== "undefined") console.warn("[sp] poll-error", e && e.message);
      }
    }

    // B′: Spotify is the always-visible default panel — no open/close lifecycle.
    // Routine windows take over via updateMode(); when they end, we fall back
    // to "spotify" automatically.
    function spCommand(cmd) {
      // Tap feedback: 20ms haptic. Portal WebView supports navigator.vibrate;
      // wrapped in a try because some old builds throw on first call.
      if (navigator.vibrate) { try { navigator.vibrate(20); } catch (_) {} }
      // Explicit pause/play tap should clear the music override immediately —
      // grace timer (30s) is only for proxy-observed stops (track gaps, brief
      // pauses). Without this, pausing during a routine left the card stuck in
      // playing-UI for 30s after the user explicitly stopped.
      if (cmd === "pause" && document.body.getAttribute("data-music-override") === "true") {
        setMusicOverride(false);
      }
      // Optimistic UI (2026-05-19): flip the play/pause icon immediately so
      // the tap feels responsive. Without this, the icon only updates on the
      // next proxy poll (600-1800ms later) — kids tap, see nothing happen,
      // tap again, fire pause→play. The optimistic flip will be corrected by
      // the next poll if Spotify didn't honor the command.
      if (cmd === "pause" || cmd === "play") {
        _spIsPlaying = (cmd === "play");
        if (spPlayPause) spPlayPause.textContent = _spIsPlaying ? "⏸" : "▶";
      }
      // Pulse the tapped button so it's obviously "received" across the
      // kitchen. Removed by the next layout/render so it self-cleans.
      const btnMap = { play: spPlayPause, pause: spPlayPause, prev: spPrevBtn, next: spNextBtn };
      const tappedBtn = btnMap[cmd];
      if (tappedBtn) {
        tappedBtn.classList.add("tap-flash");
        setTimeout(() => tappedBtn.classList.remove("tap-flash"), 240);
      }
      window.location.href = "kiosk://spotify/" + cmd;
      // Proxy edge-caches s-maxage=120 while playing — without cache-bust the
      // post-command re-poll returns stale isPlaying:true, the icon doesn't
      // flip, kid taps again → fires pause→play. Bust with ?t=<ms> so the
      // user-initiated repolls always hit origin.
      setTimeout(() => loadSpotify({ fresh: true }), 600);
      setTimeout(() => loadSpotify({ fresh: true }), 1800);
    }

    // Tap-to-launch on the idle card. Both the launch button AND the album-art
    // region open the Spotify APK — the play-overlay glyph on top of the cover
    // makes the whole tile look tappable, so it should actually be tappable.
    (function() {
      function tap() { window.location.href = "kiosk://spotify/launch"; }
      const launchBtn = document.getElementById("sp-launch-btn");
      if (launchBtn) launchBtn.addEventListener("click", tap);
      const idleArt = document.getElementById("sp-idle-art");
      if (idleArt) {
        idleArt.addEventListener("click", function() {
          // Only act as launcher when actually in idle state — playing-state
          // hides the idle art, but guard anyway in case CSS changes.
          const card = document.getElementById("spotify-card");
          if (card && card.getAttribute("data-state") === "idle") tap();
        });
        idleArt.style.cursor = "pointer";
      }
    })();

    const spPrevBtn = document.getElementById("sp-prev");
    const spNextBtn = document.getElementById("sp-next");
    // 2026-05-17: collapsed dual click+touchend bindings. preventDefault on
    // touchend was suppressing the synthetic click on Portal Chromium →
    // intermittent dead taps. touch-action: manipulation (CSS) eliminates
    // the 350ms tap delay without needing the touchend hack.
    if (spPrevBtn) spPrevBtn.addEventListener("click", function() { spCommand("prev"); });
    if (spNextBtn) spNextBtn.addEventListener("click", function() { spCommand("next"); });
    if (spPlayPause) spPlayPause.addEventListener("click", function() {
      spCommand(_spIsPlaying ? "pause" : "play");
    });

    // "Open Spotify" pill — playing-state launcher. Always reachable while
    // music plays, so the family can switch playlist/account on the APK
    // without first pausing or fumbling for the corner button.
    const spOpenPill = document.getElementById("sp-open-pill");
    if (spOpenPill) spOpenPill.addEventListener("click", function() {
      if (navigator.vibrate) { try { navigator.vibrate(20); } catch (_) {} }
      window.location.href = "kiosk://spotify/launch";
    });

    // Long-press the big album art (700ms) → launch the Spotify APK.
    // Short tap does nothing (avoids stealing the play-pause click target).
    (function() {
      const wrap = document.getElementById("sp-big-art-wrap");
      if (!wrap) return;
      let pressTimer = null;
      function start() {
        clearTimeout(pressTimer);
        pressTimer = setTimeout(function() {
          // Only fire while card is in playing state — idle has its own paths.
          const card = document.getElementById("spotify-card");
          if (card && card.getAttribute("data-state") === "playing") {
            if (navigator.vibrate) try { navigator.vibrate(20); } catch (_) {}
            window.location.href = "kiosk://spotify/launch";
          }
        }, 700);
      }
      function cancel() { clearTimeout(pressTimer); pressTimer = null; }
      wrap.addEventListener("touchstart", start, { passive: true });
      wrap.addEventListener("touchend",   cancel, { passive: true });
      wrap.addEventListener("touchcancel", cancel, { passive: true });
      wrap.addEventListener("touchmove",  cancel, { passive: true });
      wrap.addEventListener("mousedown",  start);
      wrap.addEventListener("mouseup",    cancel);
      wrap.addEventListener("mouseleave", cancel);
    })();

    // Back-to-Routine pill \u2014 clears the music override so the routine card
    // re-appears in the primary panel. Visible only while override is active.
    (function() {
      const btn = document.getElementById("routine-back");
      if (!btn) return;
      btn.addEventListener("click", function() { setMusicOverride(false); });
    })();

    // Spotify corner button \u2014 only visible during routine windows (CSS rule
    // hides it otherwise, since the in-panel card is the launcher then).
    // Smart click: music already playing \u2192 swap routine card for the player
    // (set music override). Nothing playing \u2192 launch the Spotify APK so the
    // user can pick something.
    (function() {
      const btn = document.getElementById("spotify-corner");
      if (!btn) return;
      // 2026-05-17: corner is now always visible (no longer gated to
      // morning/evening). Behavior unchanged: playing → focus the card,
      // idle → launch the Spotify APK.
      btn.addEventListener("click", function() {
        if (_spIsPlaying) setMusicOverride(true);
        else window.location.href = "kiosk://spotify/launch";
      });
    })();

    loadSpotify();
    // 2026-05-17: 15s \u2192 60s. Background poll cadence dropped 4\u00d7 to gut Vercel
    // CPU usage (proxy was 68% of all Vercel CPU). User-initiated polls after
    // a tap still cache-bust for instant UI feedback (see spCommand). Music
    // "started" detection slips from 0-15s to 0-60s; Phase 1d resurrection
    // logic auto-catches genuine stops.
    setInterval(loadSpotify, 60 * 1000);

    // ---------- Exit-to-Portal long-press (visible bottom-right button) ----------
    // 2-second hold fires kiosk://exit. MainActivity exits to Portal launcher.
    // Auto-return is now scheduled by the Activity's onStop hook (not here),
    // and the AutoReturnReceiver pauses if a call is active — so a long video
    // call won't get yanked out at 5 min.
    (function() {
      const btn = document.getElementById("exit-corner");
      if (!btn) return;
      const fill = btn.querySelector(".exit-fill");
      const HOLD_MS = 2000;
      let raf, startedAt;

      function tick() {
        const elapsed = performance.now() - startedAt;
        const pct = Math.min(100, (elapsed / HOLD_MS) * 100);
        if (fill) fill.style.background =
          `conic-gradient(var(--ochre) ${pct}%, transparent ${pct}%)`;
        if (pct >= 100) {
          stop();
          window.location.href = "kiosk://exit";
          return;
        }
        raf = requestAnimationFrame(tick);
      }
      function start(e) {
        if (e.cancelable) e.preventDefault();
        stop();
        btn.classList.add("holding");
        startedAt = performance.now();
        raf = requestAnimationFrame(tick);
      }
      function stop() {
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        btn.classList.remove("holding");
        if (fill) fill.style.background = "conic-gradient(var(--ochre) 0%, transparent 0%)";
      }
      btn.addEventListener("touchstart",  start, { passive: false });
      btn.addEventListener("touchend",    stop,  { passive: true });
      btn.addEventListener("touchcancel", stop,  { passive: true });
      btn.addEventListener("mousedown",   start);
      btn.addEventListener("mouseup",     stop);
      btn.addEventListener("mouseleave",  stop);
    })();

    // ─────────────────────────────────────────────────────────────────────────
    // SPOTIFY RESURRECTION + MEMORY HYGIENE (Phase 1d, 2026-05-17)
    // ─────────────────────────────────────────────────────────────────────────
    // (a) If we observe isPlaying:false for 3 consecutive polls but lastPlayed
    //     hasn't changed, Spotify-on-Terry probably got killed (LMK / lost
    //     audio focus / app crashed) — fire a play to resume. Caps at one
    //     attempt per 5 minutes to avoid loops if the user genuinely paused.
    // (b) Soft-reset every 6h: clear caches, free Spotify innerHTML, force a
    //     fresh poll. Replaces the meta-refresh that wiped state mid-track.
    (function() {
      let consecutiveIdlePolls = 0;
      let lastResurrectAt = 0;
      const RESURRECT_COOLDOWN_MS = 5 * 60 * 1000;
      let prevLastPlayedKey = null;

      // Hook into renderSpotify by wrapping it once at load time.
      const origRender = renderSpotify;
      window.renderSpotify = function(data) {
        try {
          if (data && data.isPlaying === false) {
            const lp = data.lastPlayed || {};
            const key = (lp.track || "") + "|" + (lp.artist || "");
            if (key === prevLastPlayedKey && key !== "|") {
              consecutiveIdlePolls += 1;
            } else {
              consecutiveIdlePolls = 1;
              prevLastPlayedKey = key;
            }
            // Don't resurrect during routine windows — kids might have asked
            // for quiet. Only auto-resume during the default spotify mode.
            const mode = document.body.getAttribute("data-mode");
            const now = Date.now();
            if (
              consecutiveIdlePolls >= 3 &&
              mode === "spotify" &&
              now - lastResurrectAt > RESURRECT_COOLDOWN_MS &&
              _spPrevPlaying
            ) {
              console.warn("[sp] resurrect: 3 idle polls, attempting auto-play", { lp });
              lastResurrectAt = now;
              consecutiveIdlePolls = 0;
              // Don't fire spCommand directly — it clears overrides we don't
              // want to clear. Bare URI is fine; kiosk media-key handler
              // will route it to whatever has audio focus.
              window.location.href = "kiosk://spotify/play";
            }
          } else if (data && data.isPlaying === true) {
            consecutiveIdlePolls = 0;
          }
        } catch (e) {
          console.warn("[sp] resurrect-error", e && e.message);
        }
        return origRender(data);
      };
    })();

    // Soft-reset every 6h. Replaces <meta http-equiv="refresh"> which wiped
    // JS state mid-track and is the prime suspect for "Spotify randomly
    // stops" reports. This version frees innerHTML on the spotify card,
    // nudges the GC (Portal Chromium supports window.gc when --js-flags
    // exposes it; harmless no-op otherwise), and re-polls cleanly.
    setInterval(function() {
      try {
        if (typeof window.gc === "function") window.gc();
        // Force a fresh Spotify poll (in case the proxy edge cache went
        // stale alongside everything else).
        loadSpotify({ fresh: true });
        console.warn("[soft-reset] ran at", new Date().toISOString());
      } catch (_) {}
    }, 6 * 60 * 60 * 1000);

    // ─────────────────────────────────────────────────────────────────────────
    // SELF-UPDATE (added 2026-09-07)
    // ─────────────────────────────────────────────────────────────────────────
    // Terry's WebView loads this page once, when MainActivity is created, and
    // there is nothing to re-fetch it: the <meta http-equiv="refresh"> was
    // removed in the 2026-05-17 hardening pass (it wiped Spotify state
    // mid-track) and the 6h soft-reset above only frees memory. So a push to
    // `main` sat live on Pages while the kitchen kept showing the old build
    // until someone rebooted Terry or ran `terry restart` over WiFi ADB.
    //
    // This closes that gap without bringing the meta refresh back. The
    // difference that matters: the old refresh reloaded blindly on a timer;
    // this one reloads only when the deployed file's validator has actually
    // changed AND the moment is safe. In a normal week it never fires.
    //
    // Safety gates, all of which must pass:
    //   - the HEAD validator (ETag, else Last-Modified) differs from the one
    //     seen at boot. No validator at all → never reload.
    //   - nothing is playing (`_spIsPlaying`) and no music override is up —
    //     this is the rule that killed the meta refresh, and it stands.
    //   - nobody has tapped in the last QUIET_MS, so we can't reload out from
    //     under a kid mid-checklist. (Routine ticks live in localStorage, so a
    //     reload never loses them — this is about not flashing mid-tap.)
    //   - at least MIN_RELOAD_GAP_MS since our last self-update reload, kept in
    //     localStorage so it survives the reload. Guards against a loop if two
    //     edge nodes ever disagree about the ETag.
    // Any gate that fails just defers to the next check — nothing is lost.
    (function() {
      const CHECK_MS           = 10 * 60 * 1000;
      const QUIET_MS           = 60 * 1000;
      const MIN_RELOAD_GAP_MS  = 30 * 60 * 1000;
      const LAST_RELOAD_KEY    = "selfUpdate:lastReload";

      // Only meaningful for the deployed page. A file:// copy opened on a
      // laptop has nothing to update to, and fetching itself there trips a
      // CORS console error (origin "null") for no reason.
      if (location.protocol !== "http:" && location.protocol !== "https:") return;

      let baseline = null;
      let lastInteractionAt = 0;

      function touched() { lastInteractionAt = Date.now(); }
      document.addEventListener("click", touched, true);
      document.addEventListener("touchstart", touched, true);

      function lastReloadAt() {
        try { return parseInt(localStorage.getItem(LAST_RELOAD_KEY), 10) || 0; }
        catch (_) { return 0; }
      }

      function blockedBy() {
        if (_spIsPlaying) return "music playing";
        if (window.__radioPlaying && window.__radioPlaying()) return "radio playing";
        if (document.body.getAttribute("data-music-override") === "true") return "music override";
        if (Date.now() - lastInteractionAt < QUIET_MS) return "someone is tapping";
        if (Date.now() - lastReloadAt() < MIN_RELOAD_GAP_MS) return "reloaded recently";
        return null;
      }

      function check() {
        // Cache-bust the request itself; Pages ignores the query string for
        // static files, so the validator we get back is the real one.
        return fetch(location.pathname + "?_selfupdate=" + Date.now(), { method: "HEAD" })
          .then(function(res) {
            if (!res.ok) return;
            const stamp = res.headers.get("etag") || res.headers.get("last-modified");
            if (!stamp) return;                  // no validator → never reload
            if (baseline === null) { baseline = stamp; return; }
            if (stamp === baseline) return;
            const blocked = blockedBy();
            if (blocked) {
              console.warn("[self-update] new build waiting —", blocked);
              return;
            }
            console.warn("[self-update] new build, reloading");
            try { localStorage.setItem(LAST_RELOAD_KEY, String(Date.now())); } catch (_) {}
            location.reload();
          })
          .catch(function() { /* offline / transient — try again next tick */ });
      }

      // Exposed for DevTools and for the headless tests: forces one check now.
      window.__selfUpdateCheck = check;

      check();                       // establish the baseline for this session
      setInterval(check, CHECK_MS);
    })();
  </script>
</body>
</html>
